<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padel Push — Score Overlay</title>
  <link rel="icon" href="/app/media/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --ov-bg: transparent;
      --ov-panel: rgba(0, 0, 0, 0.82);
      --ov-panel-2: rgba(0, 0, 45, 0.82);
      --ov-text: #ffffff;
      --ov-muted: #8f969e;
      --ov-line: rgba(255, 255, 255, 0.14);
      --ov-line-soft: rgba(255, 255, 255, 0.08);
      --ov-teamA: #b7f000;
      --ov-teamB: #27d9ff;
      --ov-radius: 0.9em;
      --ov-grad-angle: 270deg;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--ov-bg);
      font-family: "Arial", "Helvetica Neue", Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      color: var(--ov-text);
      min-height: 100vh;
    }

    .overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      /* Content-driven width: name column + however many score cells exist.
         Base case (2 sets + points) stays compact; extra sets widen the panel. */
      width: fit-content;
      min-width: 16em;
      --ov-col: 4rem;
      --ov-name-col: 10.5em;
      font-size: 24px;
      /* Two user-chosen colours blended at a user-chosen angle - no baked-in
         sheen or fixed gradient. Pick the same colour twice for a flat fill. */
      background: linear-gradient(var(--ov-grad-angle), var(--ov-panel), var(--ov-panel-2));
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--ov-radius);
      /* No overflow:hidden here — the point badge slides out past the right
         edge. Children that could poke past the rounded corners (sponsor
         strip) carry their own radius/clipping. */
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.55em;
      padding: 0.5em 1em 0.5em;
      border-bottom: 1px solid var(--ov-line);
    }

    .brand img {
      width: 1.55em;
      height: 1.55em;
      object-fit: contain;
    }

    .brand-name {
      font-size: 0.82em;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      font-style: italic;
    }

    .brand-court {
      margin-left: auto;
      font-size: 0.7em;
      font-weight: 600;
      letter-spacing: 0.035em;
      opacity: 0.85;
      max-width: 38%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ov-muted);
    }

    .score-cells {
      display: flex;
      align-items: stretch;
      gap: 0;
      height: 100%;
    }

    .team-row {
      position: relative;
      display: grid;
      /* The name column is measured in JS (syncNameColumn) and pinned to the
         widest row's natural width, so names are never clipped and both team
         rows keep their score columns aligned. */
      grid-template-columns: var(--ov-name-col) auto;
      align-items: center;
      gap: 0.9em;
      min-height: 4.75em;
      padding: 0.0em 1em;
      border-top: 1px solid var(--ov-line-soft);
    }

    .team-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.65em;
      bottom: 0.65em;
      width: 0.2em;
      border-radius: 0 0.15em 0.15em 0;
    }

    .team-row[data-team="A"]::before {
      background: var(--ov-teamA);
      box-shadow: 0 0 12px color-mix(in srgb, var(--ov-teamA) 35%, transparent);
    }

    .team-row[data-team="B"]::before {
      background: var(--ov-teamB);
      box-shadow: 0 0 12px color-mix(in srgb, var(--ov-teamB) 35%, transparent);
    }

    .team-id {
      display: flex;
      align-items: center;
      gap: 0.65em;
      min-width: 0;
    }

    .team-logo {
      width: 3em;
      height: 3em;
      object-fit: contain;
      display: none;
    }

    .team-logo.visible {
      display: block;
    }

    .team-names {
      min-width: 0;
    }

    .team-name {
      font-size: 0.6em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ov-muted);
      white-space: nowrap;
      margin-bottom: 0.12em;
    }

    .team-name.primary {
      margin: 0;
      font-size: 1em;
      font-weight: 900;
      letter-spacing: -0.015em;
      color: var(--ov-text);
      opacity: 1;
    }

    .team-row[data-team="A"] .team-name.primary {
      color: var(--ov-teamA);
    }

    .team-row[data-team="B"] .team-name.primary {
      color: var(--ov-teamB);
    }

    .player-line {
      display: flex;
      align-items: center;
      gap: 0.35em;
      min-width: 0;
      font-size: 0.82em;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: -0.012em;
      line-height: 1.2;
      white-space: nowrap;
      color: var(--ov-text);
    }

    .player-line.hidden {
      display: none;
    }

    .player-name {
      /* No ellipsis - the panel is widened to fit instead. */
      white-space: nowrap;
      font-size: 1.2em;
      letter-spacing: 0.05em;
    }

    .serve-dot {
      /* Positioning context for the ball, sized to this player's line so the
         bounce cannot stray outside their row. */
      position: relative;
      flex: 0 0 auto;
      width: 1em;
      height: 1em;
      visibility: hidden;
      margin-left: 0.3em;
    }

    .serve-dot::after {
      --size: 0.5em;
      /* Drop from the top of the line to its baseline — the player's own
         vertical region only. */
      --bounceHeight: calc(1em - var(--size) + 0.05em);
      content: "";
      position: absolute;
      top: 0;
      left: calc(50% - var(--size) / 2);
      width: var(--size);
      height: var(--size);
      background: currentColor;
      border-radius: 50%;
      z-index: 1;
      animation: serve-anim 2s linear infinite;
    }
    
    @keyframes serve-anim  {

      100%,
      0% {
        transform: translateY(0);
      }

      10%,
      90% {
        transform: translateY(calc(var(--bounceHeight) * 0.02));
      }

      20%,
      80% {
        transform: translateY(calc(var(--bounceHeight) * 0.09));
      }

      30% {
        transform: translateY(calc(var(--bounceHeight) * 0.25));
      }

      40% {
        transform: translateY(calc(var(--bounceHeight) * 0.55));
      }

      50% {
        transform: translateY(calc(var(--bounceHeight))) scaleX(1);
      }

      53% {
        transform: translateY(var(--bounceHeight)) scaleX(1.5) scaleY(0.75);
      }

      60% {
        transform: translateY(calc(var(--bounceHeight) * 0.55)) scaleX(0.75) scaleY(1.2);
      }

      70% {
        transform: translateY(calc(var(--bounceHeight) * 0.25));
      }
    }

    .team-row[data-team="A"] .serve-dot {
      color: var(--ov-teamA);
    }

    .team-row[data-team="B"] .serve-dot {
      color: var(--ov-teamB);
    }

    .serve-dot.serving {
      visibility: visible;
    }

    .team-row>.score-cells {
      align-items: center;
    }

    .team-row>.score-cells .cell {
      position: relative;
      flex: 0 0 var(--ov-col);
      width: var(--ov-col);
      height: var(--ov-col);
      min-width: var(--ov-col);
      min-height: var(--ov-col);
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid var(--ov-line);
      text-align: center;
      font-family: "Encode Sans Semi Expanded", "Arial", "Helvetica Neue", Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 1.55em;
      font-weight: 700;
      line-height: 1;
      color: var(--ov-text);
    }

    .team-row>.score-cells .cell:first-child {
      border-left: 0;
    }

    .team-row>.score-cells .cell.lost {
      opacity: 0.7;
    }

    /* Shared by team rows and the header row so the PTS column stays aligned
       even though their font sizes differ. */
    .score-cells .cell.points {
      margin-left: 0.8rem;
    }

    .team-row[data-team="A"]>.score-cells .cell.points {
      border: 1px solid color-mix(in srgb, var(--ov-teamA) 75%, transparent);
      border-radius: 0.2em;
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--ov-teamA) 3%, transparent),
          color-mix(in srgb, var(--ov-teamA) 0%, transparent));
      color: var(--ov-teamA);
      box-shadow: inset 0 0 20px color-mix(in srgb, var(--ov-teamA) 5%, transparent);
    }

    .team-row[data-team="B"]>.score-cells .cell.points {
      border: 1px solid color-mix(in srgb, var(--ov-teamB) 75%, transparent);
      border-radius: 0.2em;
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--ov-teamB) 3%, transparent),
          color-mix(in srgb, var(--ov-teamB) 0%, transparent));
      color: var(--ov-teamB);
      box-shadow: inset 0 0 20px color-mix(in srgb, var(--ov-teamB) 5%, transparent);
    }

    .status-line {
      padding: 0.3em 1em 0.55em;
      font-size: 0.58em;
      font-weight: 700;
      color: var(--ov-muted);
      display: none;
    }

    .status-line.visible {
      display: block;
    }

    .loading-line {
      padding: 0.65em 1em 0.8em;
      font-size: 0.65em;
      font-weight: 600;
      color: var(--ov-muted);
      display: flex;
      justify-content: center;
    }

    .loading-line.hidden {
      display: none;
    }

    .score-body.hidden {
      display: none;
    }

    /* ---------- Column headers ---------- */

    .head-row {
      display: grid;
      grid-template-columns: var(--ov-name-col) auto;
      gap: 0.9em;
      align-items: end;
      padding: 0.4em 1em 0;
    }

    .head-row .score-cells {
      align-items: center;
    }

    .head-row .cell {
      flex: 0 0 var(--ov-col);
      width: var(--ov-col);
      min-width: var(--ov-col);
      text-align: center;
      font-size: 0.52em;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ov-muted);
    }

    .overlay.no-headers .head-row {
      display: none;
    }

    .overlay.no-brand .brand {
      display: none;
    }

    /* ---------- Score-change / new-set animations ---------- */

    @keyframes cell-pop {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.25);
      }

      100% {
        transform: scale(1);
      }
    }

    .score-cells .cell.changed {
      animation: cell-pop 0.5s ease;
    }

    @keyframes cell-in {
      from {
        opacity: 0;
        transform: translateX(0.5em);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .score-cells .cell.new {
      animation: cell-in 0.5s ease both;
    }

    /* ---------- Set / match / golden / silver point badge ---------- */

    /* Clipping window glued to the panel's right edge. The ribbon slides
       horizontally inside it, so it appears to emerge from behind the panel
       and never adds to the overlay's height. */
    .badge-flyout {
      position: absolute;
      left: 100%;
      top: 0;
      bottom: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .badge {
      display: block;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      white-space: nowrap;
      font-size: 0.55em;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.9em 0.4em;
      border: 1px solid currentColor;
      border-left: none;
      border-radius: 0 0.45em 0.45em 0;
      transform: translateX(-100%);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .badge-flyout.visible .badge {
      transform: translateX(0);
      animation: badge-pulse 1.6s ease-in-out infinite;
    }

    .badge.team-A {
      color: var(--ov-teamA);
      background: color-mix(in srgb, var(--ov-teamA) 22%, var(--ov-panel));
    }

    .badge.team-B {
      color: var(--ov-teamB);
      background: color-mix(in srgb, var(--ov-teamB) 22%, var(--ov-panel));
    }

    .badge.gold {
      color: #f2c94c;
      background: color-mix(in srgb, #f2c94c 22%, var(--ov-panel));
    }

    .badge.silver {
      color: #d7dee8;
      background: color-mix(in srgb, #d7dee8 22%, var(--ov-panel));
    }

    .badge.star {
      color: #c9a7ff;
      background: color-mix(in srgb, #c9a7ff 22%, var(--ov-panel));
    }

    @keyframes badge-pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.65;
      }
    }

    /* ---------- Match timer ---------- */

    .match-timer {
      margin-left: 0.6em;
      font-size: 0.7em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      opacity: 0.9;
    }

    /* ---------- Sponsor strip ---------- */

    .sponsor-strip {
      /* width:0 + min-width:100% keeps the strip from contributing to the
         overlay's fit-content width — it fills whatever the scores need. */
      width: 0;
      min-width: 100%;
      height: 1.35em;
      overflow: hidden;
      border-top: 1px solid var(--ov-line);
      border-radius: 0 0 calc(var(--ov-radius) - 1px) calc(var(--ov-radius) - 1px);
      display: flex;
      align-items: center;
    }

    .sponsor-strip.hidden {
      display: none;
    }

    .sponsor-track {
      display: flex;
      align-items: center;
      width: max-content;
      height: 100%;
    }

    .sponsor-track.scrolling {
      animation: sponsor-scroll var(--sponsor-duration, 20s) linear infinite;
    }

    .sponsor-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
      padding: 0 1em;
      font-size: 0.58em;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--ov-muted);
      white-space: nowrap;
    }

    .sponsor-item img {
      height: 1.5em;
      width: auto;
      object-fit: contain;
    }

    .sponsor-item strong,
    .sponsor-item b {
      color: var(--ov-text);
      font-weight: 800;
    }

    @keyframes sponsor-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* ---------- Settings UI ---------- */

    .gear-btn {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.25;
      transition: opacity 0.2s;
    }

    .gear-btn:hover,
    .gear-btn:focus {
      opacity: 1;
    }

    .settings-panel {
      position: fixed;
      bottom: 60px;
      right: 12px;
      width: 320px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      background: rgba(10, 10, 10, 0.96);
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .settings-panel.open {
      display: block;
    }

    .settings-panel .settings-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .settings-panel h2 {
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    /* Overrides the panel's stretch-to-fill button defaults. */
    .settings-panel button.close-x {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      background: #333;
      font-size: 0.9rem;
      line-height: 1;
    }

    .settings-panel button.close-x:hover {
      background: #4a4a4a;
    }

    .settings-panel label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.72rem;
      margin-bottom: 7px;
    }

    .settings-panel input[type="text"],
    .settings-panel input[type="url"] {
      flex: 1;
      max-width: 190px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      padding: 4px 6px;
      font-size: 0.72rem;
    }

    .settings-panel textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      padding: 4px 6px;
      font-size: 0.72rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 7px;
    }

    .settings-panel input[type="color"] {
      width: 34px;
      height: 24px;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
    }

    .settings-panel input[type="range"] {
      flex: 1;
      max-width: 130px;
      accent-color: #2b60bc;
      cursor: pointer;
    }

    .settings-panel .angle-value {
      width: 3.2em;
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: 0.75;
    }

    .settings-panel input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .settings-panel .section {
      margin: 10px 0 6px;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
    }

    .settings-panel .row-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .settings-panel button {
      flex: 1;
      border: none;
      border-radius: 6px;
      padding: 7px 0;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      background: #2b60bc;
      color: #fff;
    }

    .settings-panel button.secondary {
      background: #333;
    }

    .transparent-note {
      font-size: 0.62rem;
      opacity: 0.55;
      margin-bottom: 8px;
    }

    @media (max-width: 760px) {
      .overlay {
        left: 10px;
        top: 10px;
        width: fit-content;
        min-width: 0;
        font-size: clamp(15px, 3.1vw, 22px);
      }
    }
  </style>
</head>

<body>
  <div class="overlay" id="overlayBox">
    <div class="brand">
      <img src="/app/media/img/logo.svg" alt="Brand logo" id="brandLogo" />
      <span class="brand-name" id="brandName">Padel Push</span>
      <span class="brand-court" id="courtLabel"></span>
      <span class="match-timer" id="matchTimer"></span>
    </div>

    <div class="loading-line" id="loadingLine">Loading...</div>

    <div class="score-body hidden" id="scoreBody">
      <div class="head-row" id="headRow">
        <div class="score-spacer"></div>
        <div class="score-cells" id="cellsHead"></div>
      </div>

      <div class="team-row" data-team="A">
        <div class="team-id">
          <img class="team-logo" id="logoA" alt="" />
          <div class="team-names">
            <div class="team-name" id="nameA">Team A</div>
            <div class="player-line" id="lineA1"><span class="player-name" id="playerA1"></span><span class="serve-dot"
                id="dotA1"></span></div>
            <div class="player-line" id="lineA2"><span class="player-name" id="playerA2"></span><span class="serve-dot"
                id="dotA2"></span></div>
          </div>
        </div>
        <div class="score-cells" id="cellsA"></div>
      </div>

      <div class="team-row" data-team="B">
        <div class="team-id">
          <img class="team-logo" id="logoB" alt="" />
          <div class="team-names">
            <div class="team-name" id="nameB">Team B</div>
            <div class="player-line" id="lineB1"><span class="player-name" id="playerB1"></span><span class="serve-dot"
                id="dotB1"></span></div>
            <div class="player-line" id="lineB2"><span class="player-name" id="playerB2"></span><span class="serve-dot"
                id="dotB2"></span></div>
          </div>
        </div>
        <div class="score-cells" id="cellsB"></div>
      </div>
    </div>

    <div class="badge-flyout" id="badgeLine"><span class="badge" id="badgeText"></span></div>

    <div class="status-line" id="statusLine"></div>

    <div class="sponsor-strip hidden" id="sponsorStrip">
      <div class="sponsor-track" id="sponsorTrack">
        <div class="sponsor-item" id="sponsorItemA"></div>
        <div class="sponsor-item" id="sponsorItemB" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <button class="gear-btn" id="gearBtn" title="Customise overlay" aria-label="Customise overlay">⚙</button>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-head">
      <button id="closeSettingsX" class="close-x" type="button" title="Close"
        aria-label="Close settings">&times;</button>
      <h2>Customise Overlay</h2>
    </div>
    <p class="transparent-note">The page background is transparent by default — ideal for an OBS browser source.</p>

    <div class="section">Display</div>
    <label><span>Show server indicator</span><input type="checkbox" id="setShowServer" /></label>
    <label><span>Show brand header</span><input type="checkbox" id="setShowBrand" /></label>
    <label><span>Show column headers</span><input type="checkbox" id="setShowHeaders" /></label>
    <label><span>Show team names</span><input type="checkbox" id="setShowTeamNames" /></label>
    <label><span>Show player names</span><input type="checkbox" id="setShowPlayerNames" /></label>
    <label><span>Show match timer</span><input type="checkbox" id="setShowTimer" /></label>
    <label><span>Show sponsor strip</span><input type="checkbox" id="setShowSponsor" /></label>

    <div class="section">Match timer</div>
    <label><span>Set timer</span><input type="text" id="setTimerValue" placeholder="h:mm:ss, mm:ss or minutes" /></label>

    <div class="section">Brand</div>
    <label><span>Brand text</span><input type="text" id="setBrandText" placeholder="Padel Push" /></label>
    <label><span>Brand logo URL</span><input type="url" id="setBrandLogo" placeholder="https://…" /></label>

    <div class="section">Sponsor strip (HTML, {courtId} placeholder)</div>
    <textarea id="setSponsorHtml" rows="3" placeholder="Defaults to the Padel Push message"></textarea>

    <div class="section">Colours</div>
    <label><span>Background colour 1</span><input type="color" id="setPanel" /></label>
    <label><span>Background colour 2</span><input type="color" id="setPanel2" /></label>
    <label><span>Gradient angle</span><input type="range" id="setGradAngle" min="0" max="360" step="1" /><span
        class="angle-value" id="gradAngleValue">270&deg;</span></label>
    <label><span>Text</span><input type="color" id="setText" /></label>
    <label><span>Team A</span><input type="color" id="setTeamA" /></label>
    <label><span>Team B</span><input type="color" id="setTeamB" /></label>

    <div class="section">Team names</div>
    <label><span>Team A</span><input type="text" id="setNameA" placeholder="From scoreboard" /></label>
    <label><span>Team B</span><input type="text" id="setNameB" placeholder="From scoreboard" /></label>

    <div class="section">Player names</div>
    <label><span>Player A1</span><input type="text" id="setPlayerA1" placeholder="From scoreboard" /></label>
    <label><span>Player A2</span><input type="text" id="setPlayerA2" placeholder="From scoreboard" /></label>
    <label><span>Player B1</span><input type="text" id="setPlayerB1" placeholder="From scoreboard" /></label>
    <label><span>Player B2</span><input type="text" id="setPlayerB2" placeholder="From scoreboard" /></label>

    <div class="section">Team logos (image URLs)</div>
    <label><span>Team A logo</span><input type="url" id="setLogoA" placeholder="https://…" /></label>
    <label><span>Team B logo</span><input type="url" id="setLogoB" placeholder="https://…" /></label>

    <div class="row-btns">
      <button id="resetSettings" class="secondary" type="button">Reset</button>
      <button id="closeSettings" type="button">Done</button>
    </div>
  </div>

  <script>
    (function ()
    {
      //AL.
      const isDebugCourt = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      const debugCourt_revisionUrl = "https://qa.padelpush.co.za/r/bnrm";
      const debugCourt_fullScoreUrl = "https://qa.padelpush.co.za/a/bnrm";
      //

      const POLL_INTERVAL_MS = 5 * 1000;

      const DEFAULT_SETTINGS = {
        showServer: true,
        showBrand: true,
        showHeaders: true,
        showTeamNames: true,
        showPlayerNames: true,
        showTimer: true,
        showSponsor: true,
        panel: "#000000",
        panel2: "#00002d",
        gradientAngle: 270,
        text: "#ffffff",
        teamA: "#b7f000",
        teamB: "#27d9ff",
        nameA: "",
        nameB: "",
        playerA1: "",
        playerA2: "",
        playerB1: "",
        playerB2: "",
        logoA: "",
        logoB: "",
        brandText: "",
        brandLogo: "",
        sponsorHtml: "",
        timerText: "",
        timerOffset: 0,
        timerAnchor: 0
      };

      const DEFAULT_SPONSOR_HTML =
        'Live scores brought to you by <img src="/app/media/img/logo.svg" alt="Padel Push" /> ' +
        '<strong>Padel Push</strong>. Visit <strong>padelpush.co.za</strong> and join us on this court: ' +
        '<strong>{courtId}</strong>';

      function getCourtIdFromPath()
      {
        const segments = window.location.pathname.split("/").filter(Boolean);
        const last = segments.length ? segments[segments.length - 1] : "";

        if (!last || last === "b" || last === "overlay.html")
        {
          return null;
        }

        try
        {
          return decodeURIComponent(last);
        }
        catch (_err)
        {
          return last;
        }
      }

      const courtId = getCourtIdFromPath();
      const storageKey = "padelPushOverlaySettings:" + (courtId || "default");

      let settings = { ...DEFAULT_SETTINGS };
      let latestScore = null;
      let renderedRevision = null;
      let isPolling = false;
      let lastSponsorHtml = null;
      let lastHeadLabels = null;
      const lastCellValues = {};

      function loadSettings()
      {
        try
        {
          const raw = localStorage.getItem(storageKey);
          if (raw)
          {
            settings = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
          }
        }
        catch (_err) { /* keep defaults */ }
      }

      function saveSettings()
      {
        try
        {
          localStorage.setItem(storageKey, JSON.stringify(settings));
        }
        catch (_err) { /* storage unavailable */ }
      }

      function hexToPanelRgba(hex)
      {
        const value = /^#([0-9a-f]{6})$/i.exec(hex || "");
        if (!value) return "rgba(0, 0, 0, 0.82)";
        const int = parseInt(value[1], 16);
        const r = (int >> 16) & 255;
        const g = (int >> 8) & 255;
        const b = int & 255;
        return "rgba(" + r + ", " + g + ", " + b + ", 0.82)";
      }

      function applySettings()
      {
        const root = document.documentElement.style;
        root.setProperty("--ov-panel", hexToPanelRgba(settings.panel));
        root.setProperty("--ov-panel-2", hexToPanelRgba(settings.panel2));
        root.setProperty("--ov-grad-angle", (Number(settings.gradientAngle) || 0) + "deg");
        root.setProperty("--ov-text", settings.text);
        root.setProperty("--ov-teamA", settings.teamA);
        root.setProperty("--ov-teamB", settings.teamB);

        applyLogo("logoA", settings.logoA);
        applyLogo("logoB", settings.logoB);
        applyBrand();

        const overlayBox = document.getElementById("overlayBox");
        overlayBox.classList.toggle("no-brand", settings.showBrand === false);
        overlayBox.classList.toggle("no-headers", settings.showHeaders === false);

        tickTimer();
        updateSponsor();

        if (latestScore)
        {
          render(latestScore);
        }
        else
        {
          syncNameColumn();
        }
      }

      function safeHttpUrl(url)
      {
        if (!url) return "";
        try
        {
          const parsed = new URL(url, window.location.origin);
          if (parsed.protocol === "https:" || parsed.protocol === "http:")
          {
            return parsed.href;
          }
        }
        catch (_err) { /* invalid URL */ }
        return "";
      }

      function applyBrand()
      {
        document.getElementById("brandName").textContent = settings.brandText || "Padel Push";
        document.getElementById("brandLogo").src = safeHttpUrl(settings.brandLogo) || "/app/media/img/logo.svg";
      }

      // ---------- Match timer ----------

      function formatTimer(totalSeconds)
      {
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        const mm = String(minutes).padStart(2, "0");
        const ss = String(seconds).padStart(2, "0");
        return hours > 0 ? hours + ":" + mm + ":" + ss : mm + ":" + ss;
      }

      // Accepts "h:mm:ss", "mm:ss" or a plain number of minutes; returns seconds.
      function parseTimerInput(raw)
      {
        const value = (raw || "").trim();
        if (!value) return 0;
        if (/^\d+$/.test(value)) return parseInt(value, 10) * 60;

        const parts = value.split(":").map((part) => part.trim());
        if (parts.length < 2 || parts.length > 3 || parts.some((part) => !/^\d+$/.test(part)))
        {
          return 0;
        }

        return parts.reduce((total, part) => total * 60 + parseInt(part, 10), 0);
      }

      function tickTimer()
      {
        const el = document.getElementById("matchTimer");
        if (settings.showTimer === false)
        {
          el.style.display = "none";
          return;
        }

        el.style.display = "";
        const anchor = settings.timerAnchor || Date.now();
        const offset = Number(settings.timerOffset) || 0;
        const elapsed = Math.max(0, Math.floor((Date.now() - anchor) / 1000) + offset);
        el.textContent = formatTimer(elapsed);
      }

      // ---------- Sponsor strip ----------

      function updateSponsor()
      {
        const strip = document.getElementById("sponsorStrip");
        const show = settings.showSponsor !== false;
        strip.classList.toggle("hidden", !show);
        if (!show) return;

        const displayCourtId = ((latestScore && latestScore.courtId) || courtId || "").toUpperCase();
        const html = (settings.sponsorHtml || DEFAULT_SPONSOR_HTML).split("{courtId}").join(displayCourtId);

        if (html !== lastSponsorHtml)
        {
          lastSponsorHtml = html;
          document.getElementById("sponsorItemA").innerHTML = html;
          document.getElementById("sponsorItemB").innerHTML = html;

          // Images load async and change the strip's width — re-measure as they arrive.
          document.querySelectorAll("#sponsorItemA img").forEach((img) =>
          {
            img.addEventListener("load", measureSponsor, { once: true });
          });
        }

        measureSponsor();
      }

      function measureSponsor()
      {
        const strip = document.getElementById("sponsorStrip");
        if (strip.classList.contains("hidden")) return;

        const track = document.getElementById("sponsorTrack");
        const itemA = document.getElementById("sponsorItemA");
        const itemB = document.getElementById("sponsorItemB");
        const overflows = itemA.scrollWidth > strip.clientWidth + 1;

        // The second (duplicate) item only exists to make the loop seamless.
        itemB.style.display = overflows ? "" : "none";
        track.classList.toggle("scrolling", overflows);
        track.style.setProperty("--sponsor-duration", Math.max(8, Math.round(itemA.scrollWidth / 30)) + "s");
      }

      // Player names must never be truncated, so the name column is sized to
      // the widest row's natural content instead of a fixed width. Both team
      // rows and the header share one pinned value so the score columns stay
      // aligned. The original 10.5em acts as a floor so short names don't
      // shrink the panel below its usual size.
      function syncNameColumn()
      {
        const overlay = document.getElementById("overlayBox");

        // Let each row size to its own content, measure, then pin the widest.
        overlay.style.setProperty("--ov-name-col", "max-content");

        let widest = parseFloat(getComputedStyle(overlay).fontSize) * 10.5 || 0;
        document.querySelectorAll(".team-row .team-id").forEach((el) =>
        {
          widest = Math.max(widest, el.getBoundingClientRect().width);
        });

        overlay.style.setProperty("--ov-name-col", Math.ceil(widest) + "px");
      }

      function applyLogo(id, url)
      {
        const img = document.getElementById(id);
        let safeUrl = "";

        if (url)
        {
          try
          {
            const parsed = new URL(url, window.location.origin);
            if (parsed.protocol === "https:" || parsed.protocol === "http:")
            {
              safeUrl = parsed.href;
            }
          }
          catch (_err) { /* invalid URL */ }
        }

        if (safeUrl)
        {
          img.src = safeUrl;
          img.classList.add("visible");
        }
        else
        {
          img.removeAttribute("src");
          img.classList.remove("visible");
        }
      }

      function setCells(containerId, cells)
      {
        const container = document.getElementById(containerId);
        const previous = lastCellValues[containerId] || null;
        container.textContent = "";

        cells.forEach((cell, index) =>
        {
          const isNew = !previous || index >= previous.length;
          const changed = !isNew && previous[index] !== String(cell.value);

          const div = document.createElement("div");
          div.className = "cell" +
            (cell.highlight ? " points" : "") +
            (cell.won ? " won" : "") +
            (cell.lost ? " lost" : "") +
            (isNew ? " new" : changed ? " changed" : "");
          div.textContent = cell.value;
          container.appendChild(div);
        });

        lastCellValues[containerId] = cells.map((cell) => String(cell.value));
      }

      function setHeadCells(columns)
      {
        const container = document.getElementById("cellsHead");
        container.textContent = "";

        columns.forEach((column, index) =>
        {
          const div = document.createElement("div");
          div.className = "cell" +
            (column.highlight ? " points" : "") +
            (lastHeadLabels && index >= lastHeadLabels.length ? " new" : "");
          div.textContent = column.label;
          container.appendChild(div);
        });

        lastHeadLabels = columns.map((column) => column.label);
      }

      function getPlayerName(slot, data)
      {
        return settings["player" + slot] || data.playerNames[slot] || "";
      }

      // Columns are identical for both teams, so a single build keeps them aligned.
      function buildColumns(data)
      {
        const columns = [];
        const mode = data.scoringMode || "standard";

        if (mode === "standard")
        {
          (data.completedSets || []).forEach((set, index) =>
          {
            const a = Number(set.A) || 0;
            const b = Number(set.B) || 0;
            columns.push({
              label: "S" + (index + 1),
              A: { value: a, won: a > b, lost: b > a},
              B: { value: b, won: b > a, lost: a > b }
            });
          });

          const currentIndex = (data.completedSets || []).length + 1;
          if (!data.matchComplete)
          {
            columns.push({
              label: "S" + currentIndex,
              A: { value: data.teams.A.games },
              B: { value: data.teams.B.games }
            });
          }
        }

        if (mode !== "standard" || !data.matchComplete)
        {
          const label = mode === "standard" && data.inTiebreak ? "TB" : "PTS";
          columns.push({
            label,
            highlight: true,
            A: { value: data.teams.A.pointsDisplay, highlight: true },
            B: { value: data.teams.B.pointsDisplay, highlight: true }
          });
        }

        return columns;
      }

      // Fallback for backends that don't send deuceCycles yet: silver/star
      // points follow cancelled advantages, so count Ad -> deuce transitions
      // observed within the current game (silver decides after 1, star after 2).
      let sawAdGameKey = null;
      let adWasActive = false;
      let cancelledAdsInGame = 0;

      function trackAdvantage(data)
      {
        const gameKey = [
          (data.completedSets || []).length,
          data.teams.A.games,
          data.teams.B.games
        ].join("|");

        if (gameKey !== sawAdGameKey)
        {
          sawAdGameKey = gameKey;
          adWasActive = false;
          cancelledAdsInGame = 0;
        }

        const hasAd = String(data.teams.A.pointsDisplay) === "Ad" || String(data.teams.B.pointsDisplay) === "Ad";
        if (hasAd)
        {
          adWasActive = true;
        }
        else if (adWasActive)
        {
          adWasActive = false;
          cancelledAdsInGame++;
        }
      }

      // Derives set / golden / silver point purely from the score payload.
      // No match-point badge: the sets required to win aren't knowable here.
      function computeBadge(data)
      {
        if ((data.scoringMode || "standard") !== "standard" || data.matchComplete) return null;

        const pts = {
          A: String(data.teams.A.pointsDisplay ?? ""),
          B: String(data.teams.B.pointsDisplay ?? "")
        };
        const games = {
          A: Number(data.teams.A.games) || 0,
          B: Number(data.teams.B.games) || 0
        };

        function gamePoint(team)
        {
          const other = team === "A" ? "B" : "A";
          if (data.inTiebreak)
          {
            const p = Number(pts[team]) || 0;
            const po = Number(pts[other]) || 0;
            return p >= 6 && p > po;
          }
          if (pts[team] === "Ad") return true;
          return pts[team] === "40" && pts[other] !== "40" && pts[other] !== "Ad";
        }

        function setPoint(team)
        {
          if (!gamePoint(team)) return false;
          if (data.inTiebreak) return true;
          const other = team === "A" ? "B" : "A";
          return games[team] >= 5 && games[team] - games[other] >= 1;
        }

        for (const team of ["A", "B"])
        {
          if (setPoint(team)) return { text: "Set point", cls: "team-" + team };
        }

        const deuceMode = (data.scoringOptions && data.scoringOptions.deuceMode) || "standard";
        const atDeuce = !data.inTiebreak && pts.A === "40" && pts.B === "40";
        if (atDeuce && deuceMode === "golden")
        {
          return { text: "Golden point", cls: "gold" };
        }
        // Silver decides after one deuce cycle, star after two. Prefer the
        // backend's deuceCycles; infer from observed cancelled advantages
        // when the field isn't in the payload yet.
        if (atDeuce && (deuceMode === "silver" || deuceMode === "star"))
        {
          const cyclesKnown = data.deuceCycles !== undefined && data.deuceCycles !== null;
          const cycles = cyclesKnown ? (Number(data.deuceCycles) || 0) : cancelledAdsInGame;
          if (deuceMode === "silver" && cycles >= 1) return { text: "Silver point", cls: "silver" };
          if (deuceMode === "star" && cycles >= 2) return { text: "Star point", cls: "star" };
        }

        return null;
      }

      function render(data)
      {
        latestScore = data;
        trackAdvantage(data);

        document.getElementById("loadingLine").classList.add("hidden");
        document.getElementById("scoreBody").classList.remove("hidden");
        const displayCourtId = data.courtId || courtId || "";
        document.getElementById("courtLabel").textContent =
          displayCourtId ? "Join: " + displayCourtId.toUpperCase() : "";

        const server = settings.showServer ? (data.server || "") : "";
        const showTeamNames = settings.showTeamNames !== false;
        const showPlayerNames = settings.showPlayerNames !== false;

        ["A", "B"].forEach((team) =>
        {
          const teamName = settings["name" + team] || data.teamNames[team] || ("Team " + team);
          const nameEl = document.getElementById("name" + team);
          nameEl.textContent = teamName;
          nameEl.style.display = showTeamNames ? "" : "none";

          let hasAnyPlayer = false;

          [1, 2].forEach((index) =>
          {
            const slot = team + index;
            const playerName = showPlayerNames ? getPlayerName(slot, data) : "";
            const line = document.getElementById("line" + slot);

            line.classList.toggle("hidden", !playerName);
            document.getElementById("player" + slot).textContent = playerName;
            document.getElementById("dot" + slot).classList.toggle("serving", server === slot);

            if (playerName) hasAnyPlayer = true;
          });

          nameEl.classList.toggle("primary", !hasAnyPlayer);
        });

        const columns = buildColumns(data);
        setHeadCells(columns);
        ["A", "B"].forEach((team) => setCells("cells" + team, columns.map((column) => column[team])));

        const badge = computeBadge(data);
        const badgeLine = document.getElementById("badgeLine");
        if (badge)
        {
          // Text/colour are left untouched when hiding so the ribbon keeps
          // its label while it slides back behind the panel.
          const badgeText = document.getElementById("badgeText");
          badgeText.textContent = badge.text;
          badgeText.className = "badge " + badge.cls;
        }
        badgeLine.classList.toggle("visible", Boolean(badge));

        const statusLine = document.getElementById("statusLine");
        if (data.matchComplete)
        {
          statusLine.textContent = "Match complete";
          statusLine.classList.add("visible");
        }
        else
        {
          statusLine.textContent = "";
          statusLine.classList.remove("visible");
        }

        // Names have just changed - re-measure before the sponsor strip, whose
        // scroll test depends on the final panel width.
        syncNameColumn();

        // The court id may only be known once data arrives; refresh the strip.
        updateSponsor();
      }

      function showError(message)
      {
        document.getElementById("loadingLine").classList.add("hidden");
        const statusLine = document.getElementById("statusLine");
        statusLine.textContent = message;
        statusLine.classList.add("visible");
      }

      async function fetchJson(path)
      {
        const response = await fetch(path, { cache: "no-store" });
        let data = null;

        try
        {
          data = await response.json();
        }
        catch (_parseErr) { /* non-JSON body */ }

        if (!response.ok || !data || !data.success)
        {
          throw new Error((data && data.error) || "Could not load score.");
        }

        return data;
      }

      async function loadFullScore()
      {
        const url = isDebugCourt ? debugCourt_fullScoreUrl : "/a/" + encodeURIComponent(courtId);
        const data = await fetchJson(url);
        render(data);
        // Trust the revision that shipped with this payload rather than the one
        // that triggered the fetch, so a change landing mid-request is not
        // mistaken for already-rendered state on the next poll.
        renderedRevision = data.revision || null;
      }

      async function poll()
      {
        if (!courtId)
        {
          showError("No court specified. Use /b/{courtId}.");
          return;
        }

        if (isPolling) return;
        isPolling = true;

        try
        {
          const revisionUrl = isDebugCourt ? debugCourt_revisionUrl : "/r/" + encodeURIComponent(courtId);
          const revisionData = await fetchJson(revisionUrl);

          if (revisionData.revision && revisionData.revision === renderedRevision)
          {
            if (latestScore) render(latestScore);
            return;
          }

          await loadFullScore();
        }
        catch (err)
        {
          showError(err.message === "Failed to fetch" ? "Connection lost. Retrying…" : err.message);
        }
        finally
        {
          isPolling = false;
        }
      }

      // ---------- Settings UI wiring ----------
      const fieldMap = {
        setPanel: "panel",
        setPanel2: "panel2",
        setText: "text",
        setTeamA: "teamA",
        setTeamB: "teamB",
        setNameA: "nameA",
        setNameB: "nameB",
        setPlayerA1: "playerA1",
        setPlayerA2: "playerA2",
        setPlayerB1: "playerB1",
        setPlayerB2: "playerB2",
        setLogoA: "logoA",
        setLogoB: "logoB",
        setBrandText: "brandText",
        setBrandLogo: "brandLogo",
        setSponsorHtml: "sponsorHtml"
      };

      const URL_KEYS = ["logoA", "logoB", "brandLogo"];

      const checkboxMap = {
        setShowServer: "showServer",
        setShowBrand: "showBrand",
        setShowHeaders: "showHeaders",
        setShowTeamNames: "showTeamNames",
        setShowPlayerNames: "showPlayerNames",
        setShowTimer: "showTimer",
        setShowSponsor: "showSponsor"
      };

      function syncInputsFromSettings()
      {
        Object.entries(fieldMap).forEach(([inputId, key]) =>
        {
          document.getElementById(inputId).value = settings[key];
        });

        Object.entries(checkboxMap).forEach(([inputId, key]) =>
        {
          document.getElementById(inputId).checked = settings[key] !== false;
        });

        document.getElementById("setTimerValue").value = settings.timerText || "";

        const angle = Number(settings.gradientAngle) || 0;
        document.getElementById("setGradAngle").value = angle;
        document.getElementById("gradAngleValue").textContent = angle + "\u00b0";
      }

      Object.entries(fieldMap).forEach(([inputId, key]) =>
      {
        document.getElementById(inputId).addEventListener("input", (event) =>
        {
          settings[key] = URL_KEYS.includes(key) ? event.target.value.trim() : event.target.value;
          saveSettings();
          applySettings();
        });
      });

      Object.entries(checkboxMap).forEach(([inputId, key]) =>
      {
        document.getElementById(inputId).addEventListener("change", (event) =>
        {
          settings[key] = event.target.checked;
          saveSettings();
          applySettings();
        });
      });

      document.getElementById("setGradAngle").addEventListener("input", (event) =>
      {
        settings.gradientAngle = Number(event.target.value) || 0;
        document.getElementById("gradAngleValue").textContent = settings.gradientAngle + "\u00b0";
        saveSettings();
        applySettings();
      });

      document.getElementById("setTimerValue").addEventListener("change", (event) =>
      {
        settings.timerText = event.target.value.trim();
        settings.timerOffset = parseTimerInput(settings.timerText);
        settings.timerAnchor = Date.now();
        saveSettings();
        tickTimer();
      });

      const gearBtn = document.getElementById("gearBtn");
      const settingsPanel = document.getElementById("settingsPanel");

      gearBtn.addEventListener("click", () =>
      {
        settingsPanel.classList.toggle("open");
      });

      ["closeSettings", "closeSettingsX"].forEach((id) =>
      {
        document.getElementById(id).addEventListener("click", () =>
        {
          settingsPanel.classList.remove("open");
        });
      });

      document.getElementById("resetSettings").addEventListener("click", () =>
      {
        // Drop the stored blob entirely so stale keys from older versions
        // cannot survive a reset, then restart the timer from zero.
        try
        {
          localStorage.removeItem(storageKey);
        }
        catch (_err) { /* storage unavailable */ }

        settings = { ...DEFAULT_SETTINGS, timerAnchor: Date.now() };
        saveSettings();
        syncInputsFromSettings();
        applySettings();
      });

      // ---------- Boot ----------
      loadSettings();

      // Anchor the timer on first ever load so it survives OBS source refreshes.
      if (!settings.timerAnchor)
      {
        settings.timerAnchor = Date.now();
        saveSettings();
      }

      syncInputsFromSettings();
      applySettings();
      setInterval(tickTimer, 1000);
      window.addEventListener("resize", () =>
      {
        syncNameColumn();
        measureSponsor();
      });
      void poll();
      setInterval(poll, POLL_INTERVAL_MS);
    })();
  </script>
</body>

</html>
