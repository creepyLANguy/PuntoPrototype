<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padel Push — Score Overlay</title>
  <link rel="icon" href="/app/media/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --ov-bg: transparent;
      --ov-panel: rgba(8, 12, 16, 0.96);
      --ov-panel-2: rgba(15, 20, 26, 0.96);
      --ov-text: #ffffff;
      --ov-muted: #8f969e;
      --ov-line: rgba(255, 255, 255, 0.14);
      --ov-line-soft: rgba(255, 255, 255, 0.08);
      --ov-teamA: #b7f000;
      --ov-teamB: #27d9ff;
      --ov-accent: #2b60bc;
      --ov-radius: 0.9em;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--ov-bg);
      font-family: "Arial", "Helvetica Neue", Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      color: var(--ov-text);
      min-height: 100vh;
    }

    .overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      /* Content-driven width: name column + however many score cells exist.
         Base case (2 sets + points) stays compact; extra sets widen the panel. */
      width: fit-content;
      min-width: 16em;
      --ov-col: 4rem;
      --ov-name-col: 10.5em;
      max-width: calc(100vw - 32px);
      font-size: 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.025), transparent 28%),
        linear-gradient(180deg, var(--ov-panel-2), var(--ov-panel));
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--ov-radius);
      overflow: hidden;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.55em;
      padding: 0.5em 1em 0.5em;
      border-bottom: 1px solid var(--ov-line);
    }

    .brand img {
      width: 1.55em;
      height: 1.55em;
      object-fit: contain;
    }

    .brand-name {
      font-size: 0.82em;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      font-style: italic;
    }

    .brand-court {
      margin-left: auto;
      font-size: 0.7em;
      font-weight: 600;
      letter-spacing: 0.035em;
      opacity: 0.85;
      max-width: 38%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ov-muted);
    }

    .score-cells {
      display: flex;
      align-items: stretch;
      gap: 0;
      height: 100%;
    }

    .team-row {
      position: relative;
      display: grid;
      /* Fixed name column keeps the panel width deterministic; long names
         truncate instead of stretching the overlay. */
      grid-template-columns: var(--ov-name-col) auto;
      align-items: center;
      gap: 0.9em;
      min-height: 4.75em;
      padding: 0.0em 1em;
      border-top: 1px solid var(--ov-line-soft);
    }

    .team-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.65em;
      bottom: 0.65em;
      width: 0.2em;
      border-radius: 0 0.15em 0.15em 0;
    }

    .team-row[data-team="A"]::before {
      background: var(--ov-teamA);
      box-shadow: 0 0 12px color-mix(in srgb, var(--ov-teamA) 35%, transparent);
    }

    .team-row[data-team="B"]::before {
      background: var(--ov-teamB);
      box-shadow: 0 0 12px color-mix(in srgb, var(--ov-teamB) 35%, transparent);
    }

    .team-id {
      display: flex;
      align-items: center;
      gap: 0.65em;
      min-width: 0;
    }

    .team-logo {
      width: 3em;
      height: 3em;
      object-fit: contain;
      display: none;
    }

    .team-logo.visible {
      display: block;
    }

    .team-names {
      min-width: 0;
      overflow: hidden;
    }

    .team-name {
      font-size: 0.6em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ov-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.12em;
    }

    .team-name.primary {
      margin: 0;
      font-size: 1em;
      font-weight: 900;
      letter-spacing: -0.015em;
      color: var(--ov-text);
      opacity: 1;
    }

    .team-row[data-team="A"] .team-name.primary {
      color: var(--ov-teamA);
    }

    .team-row[data-team="B"] .team-name.primary {
      color: var(--ov-teamB);
    }

    .player-line {
      display: flex;
      align-items: center;
      gap: 0.35em;
      min-width: 0;
      font-size: 0.82em;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: -0.012em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      color: var(--ov-text);
    }

    .player-line.hidden {
      display: none;
    }

    .player-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 1.2em;
      letter-spacing: 0.05em;
    }

    .serve-dot {
      /* Positioning context for the ball, sized to this player's line so the
         bounce cannot stray outside their row. */
      position: relative;
      flex: 0 0 auto;
      width: 1em;
      height: 1em;
      visibility: hidden;
      margin-left: 0.3em;
    }

    .serve-dot::after {
      --size: 0.5em;
      /* Drop from the top of the line to its baseline — the player's own
         vertical region only. */
      --bounceHeight: calc(1em - var(--size) + 0.05em);
      content: "";
      position: absolute;
      top: 0;
      left: calc(50% - var(--size) / 2);
      width: var(--size);
      height: var(--size);
      background: currentColor;
      border-radius: 50%;
      z-index: 1;
      animation: serve-anim 2s linear infinite;
    }
    
    @keyframes serve-anim  {

      100%,
      0% {
        transform: translateY(0);
      }

      10%,
      90% {
        transform: translateY(calc(var(--bounceHeight) * 0.02));
      }

      20%,
      80% {
        transform: translateY(calc(var(--bounceHeight) * 0.09));
      }

      30% {
        transform: translateY(calc(var(--bounceHeight) * 0.25));
      }

      40% {
        transform: translateY(calc(var(--bounceHeight) * 0.55));
      }

      50% {
        transform: translateY(calc(var(--bounceHeight))) scaleX(1);
      }

      53% {
        transform: translateY(var(--bounceHeight)) scaleX(1.5) scaleY(0.75);
      }

      60% {
        transform: translateY(calc(var(--bounceHeight) * 0.55)) scaleX(0.75) scaleY(1.2);
      }

      70% {
        transform: translateY(calc(var(--bounceHeight) * 0.25));
      }
    }

    .team-row[data-team="A"] .serve-dot {
      color: var(--ov-teamA);
    }

    .team-row[data-team="B"] .serve-dot {
      color: var(--ov-teamB);
    }

    .serve-dot.serving {
      visibility: visible;
    }

    .team-row>.score-cells {
      align-items: center;
    }

    .team-row>.score-cells .cell {
      position: relative;
      flex: 0 0 var(--ov-col);
      width: var(--ov-col);
      height: var(--ov-col);
      min-width: var(--ov-col);
      min-height: var(--ov-col);
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid var(--ov-line);
      text-align: center;
      font-family: "Encode Sans Semi Expanded", "Arial", "Helvetica Neue", Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 1.55em;
      font-weight: 700;
      line-height: 1;
      color: var(--ov-text);
    }

    .team-row>.score-cells .cell:first-child {
      border-left: 0;
    }

    .team-row>.score-cells .cell.lost {
      opacity: 0.7;
    }

    .team-row[data-team="A"]>.score-cells .cell.points {
      margin-left: 0.35em;
      border: 1px solid color-mix(in srgb, var(--ov-teamA) 75%, transparent);
      border-radius: 0.2em;
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--ov-teamA) 3%, transparent),
          color-mix(in srgb, var(--ov-teamA) 0%, transparent));
      color: var(--ov-teamA);
      box-shadow: inset 0 0 20px color-mix(in srgb, var(--ov-teamA) 5%, transparent);
    }

    .team-row[data-team="B"]>.score-cells .cell.points {
      margin-left: 0.35em;
      border: 1px solid color-mix(in srgb, var(--ov-teamB) 75%, transparent);
      border-radius: 0.2em;
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--ov-teamB) 3%, transparent),
          color-mix(in srgb, var(--ov-teamB) 0%, transparent));
      color: var(--ov-teamB);
      box-shadow: inset 0 0 20px color-mix(in srgb, var(--ov-teamB) 5%, transparent);
    }

    .status-line {
      padding: 0.3em 1em 0.55em;
      font-size: 0.58em;
      font-weight: 700;
      color: var(--ov-muted);
      display: none;
    }

    .status-line.visible {
      display: block;
    }

    .loading-line {
      padding: 0.65em 1em 0.8em;
      font-size: 0.65em;
      font-weight: 600;
      color: var(--ov-muted);
      display: flex;
      justify-content: center;
    }

    .loading-line.hidden {
      display: none;
    }

    .score-body.hidden {
      display: none;
    }

    /* ---------- Settings UI ---------- */

    .gear-btn {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.25;
      transition: opacity 0.2s;
    }

    .gear-btn:hover,
    .gear-btn:focus {
      opacity: 1;
    }

    .settings-panel {
      position: fixed;
      bottom: 60px;
      right: 12px;
      width: 320px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      background: rgba(10, 10, 10, 0.96);
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .settings-panel.open {
      display: block;
    }

    .settings-panel h2 {
      font-size: 0.9rem;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .settings-panel label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.72rem;
      margin-bottom: 7px;
    }

    .settings-panel input[type="text"],
    .settings-panel input[type="url"] {
      flex: 1;
      max-width: 190px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      padding: 4px 6px;
      font-size: 0.72rem;
    }

    .settings-panel input[type="color"] {
      width: 34px;
      height: 24px;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
    }

    .settings-panel input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .settings-panel .section {
      margin: 10px 0 6px;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
    }

    .settings-panel .row-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .settings-panel button {
      flex: 1;
      border: none;
      border-radius: 6px;
      padding: 7px 0;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      background: #2b60bc;
      color: #fff;
    }

    .settings-panel button.secondary {
      background: #333;
    }

    .transparent-note {
      font-size: 0.62rem;
      opacity: 0.55;
      margin-bottom: 8px;
    }

    @media (max-width: 760px) {
      .overlay {
        left: 10px;
        top: 10px;
        width: fit-content;
        max-width: calc(100vw - 20px);
        min-width: 0;
        font-size: clamp(15px, 3.1vw, 22px);
      }
    }
  </style>
</head>

<body>
  <div class="overlay" id="overlayBox">
    <div class="brand">
      <img src="/app/media/img/logo.svg" alt="Padel Push logo" />
      <span class="brand-name">Padel Push</span>
      <span class="brand-court" id="courtLabel"></span>
    </div>

    <div class="loading-line" id="loadingLine">Loading...</div>

    <div class="score-body hidden" id="scoreBody">
        <div class="score-spacer"></div>
        <div class="score-cells" id="cellsHead"></div>

      <div class="team-row" data-team="A">
        <div class="team-id">
          <img class="team-logo" id="logoA" alt="" />
          <div class="team-names">
            <div class="team-name" id="nameA">Team A</div>
            <div class="player-line" id="lineA1"><span class="player-name" id="playerA1"></span><span class="serve-dot"
                id="dotA1"></span></div>
            <div class="player-line" id="lineA2"><span class="player-name" id="playerA2"></span><span class="serve-dot"
                id="dotA2"></span></div>
          </div>
        </div>
        <div class="score-cells" id="cellsA"></div>
      </div>

      <div class="team-row" data-team="B">
        <div class="team-id">
          <img class="team-logo" id="logoB" alt="" />
          <div class="team-names">
            <div class="team-name" id="nameB">Team B</div>
            <div class="player-line" id="lineB1"><span class="player-name" id="playerB1"></span><span class="serve-dot"
                id="dotB1"></span></div>
            <div class="player-line" id="lineB2"><span class="player-name" id="playerB2"></span><span class="serve-dot"
                id="dotB2"></span></div>
          </div>
        </div>
        <div class="score-cells" id="cellsB"></div>
      </div>
    </div>

    <div class="status-line" id="statusLine"></div>
  </div>

  <button class="gear-btn" id="gearBtn" title="Customise overlay" aria-label="Customise overlay">⚙</button>

  <div class="settings-panel" id="settingsPanel">
    <h2>Customise Overlay</h2>
    <p class="transparent-note">The page background is transparent by default — ideal for an OBS browser source.</p>

    <div class="section">Display</div>
    <label><span>Show server indicator</span><input type="checkbox" id="setShowServer" /></label>

    <div class="section">Colours</div>
    <label><span>Panel background</span><input type="color" id="setPanel" /></label>
    <label><span>Text</span><input type="color" id="setText" /></label>
    <label><span>Team A</span><input type="color" id="setTeamA" /></label>
    <label><span>Team B</span><input type="color" id="setTeamB" /></label>
    <label><span>Accent</span><input type="color" id="setAccent" /></label>

    <div class="section">Team names</div>
    <label><span>Team A</span><input type="text" id="setNameA" placeholder="From scoreboard" /></label>
    <label><span>Team B</span><input type="text" id="setNameB" placeholder="From scoreboard" /></label>

    <div class="section">Player names</div>
    <label><span>Player A1</span><input type="text" id="setPlayerA1" placeholder="From scoreboard" /></label>
    <label><span>Player A2</span><input type="text" id="setPlayerA2" placeholder="From scoreboard" /></label>
    <label><span>Player B1</span><input type="text" id="setPlayerB1" placeholder="From scoreboard" /></label>
    <label><span>Player B2</span><input type="text" id="setPlayerB2" placeholder="From scoreboard" /></label>

    <div class="section">Team logos (image URLs)</div>
    <label><span>Team A logo</span><input type="url" id="setLogoA" placeholder="https://…" /></label>
    <label><span>Team B logo</span><input type="url" id="setLogoB" placeholder="https://…" /></label>

    <div class="row-btns">
      <button id="resetSettings" class="secondary" type="button">Reset</button>
      <button id="closeSettings" type="button">Done</button>
    </div>
  </div>

  <script>
    (function ()
    {
      //AL.
      const isDebugCourt = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      const debugCourt_revisionUrl = "https://qa.padelpush.co.za/r/bnrm";
      const debugCourt_fullScoreUrl = "https://qa.padelpush.co.za/a/bnrm";
      //

      const POLL_INTERVAL_MS = 5 * 1000;

      const DEFAULT_SETTINGS = {
        showServer: true,
        panel: "#080c10",
        text: "#ffffff",
        teamA: "#b7f000",
        teamB: "#27d9ff",
        accent: "#2b60bc",
        nameA: "",
        nameB: "",
        playerA1: "",
        playerA2: "",
        playerB1: "",
        playerB2: "",
        logoA: "",
        logoB: ""
      };

      function getCourtIdFromPath()
      {
        const segments = window.location.pathname.split("/").filter(Boolean);
        const last = segments.length ? segments[segments.length - 1] : "";

        if (!last || last === "b" || last === "overlay.html")
        {
          return null;
        }

        try
        {
          return decodeURIComponent(last);
        }
        catch (_err)
        {
          return last;
        }
      }

      const courtId = getCourtIdFromPath();
      const storageKey = "padelPushOverlaySettings:" + (courtId || "default");

      let settings = { ...DEFAULT_SETTINGS };
      let latestScore = null;
      let renderedRevision = null;
      let isPolling = false;

      function loadSettings()
      {
        try
        {
          const raw = localStorage.getItem(storageKey);
          if (raw)
          {
            settings = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
          }
        }
        catch (_err) { /* keep defaults */ }
      }

      function saveSettings()
      {
        try
        {
          localStorage.setItem(storageKey, JSON.stringify(settings));
        }
        catch (_err) { /* storage unavailable */ }
      }

      function hexToPanelRgba(hex)
      {
        const value = /^#([0-9a-f]{6})$/i.exec(hex || "");
        if (!value) return "rgba(0, 0, 0, 0.82)";
        const int = parseInt(value[1], 16);
        const r = (int >> 16) & 255;
        const g = (int >> 8) & 255;
        const b = int & 255;
        return "rgba(" + r + ", " + g + ", " + b + ", 0.82)";
      }

      function applySettings()
      {
        const root = document.documentElement.style;
        root.setProperty("--ov-panel", hexToPanelRgba(settings.panel));
        root.setProperty("--ov-text", settings.text);
        root.setProperty("--ov-teamA", settings.teamA);
        root.setProperty("--ov-teamB", settings.teamB);
        root.setProperty("--ov-accent", settings.accent);

        applyLogo("logoA", settings.logoA);
        applyLogo("logoB", settings.logoB);

        if (latestScore)
        {
          render(latestScore);
        }
      }

      function applyLogo(id, url)
      {
        const img = document.getElementById(id);
        let safeUrl = "";

        if (url)
        {
          try
          {
            const parsed = new URL(url, window.location.origin);
            if (parsed.protocol === "https:" || parsed.protocol === "http:")
            {
              safeUrl = parsed.href;
            }
          }
          catch (_err) { /* invalid URL */ }
        }

        if (safeUrl)
        {
          img.src = safeUrl;
          img.classList.add("visible");
        }
        else
        {
          img.removeAttribute("src");
          img.classList.remove("visible");
        }
      }

      function setCells(containerId, cells)
      {
        const container = document.getElementById(containerId);
        container.textContent = "";

        cells.forEach((cell) =>
        {
          const div = document.createElement("div");
          div.className = "cell" +
            (cell.highlight ? " points" : "") +
            (cell.won ? " won" : "") + 
            (cell.lost? " lost" : "");
          div.textContent = cell.value;
          container.appendChild(div);
        });
      }

      function setHeadCells(labels)
      {
        const container = document.getElementById("cellsHead");
        container.textContent = "";
      }

      function getPlayerName(slot, data)
      {
        return settings["player" + slot] || data.playerNames[slot] || "";
      }

      // Columns are identical for both teams, so a single build keeps them aligned.
      function buildColumns(data)
      {
        const columns = [];
        const mode = data.scoringMode || "standard";

        if (mode === "standard")
        {
          (data.completedSets || []).forEach((set, index) =>
          {
            const a = Number(set.A) || 0;
            const b = Number(set.B) || 0;
            columns.push({
              label: "Set " + (index + 1),
              A: { value: a, won: a > b, lost: b > a},
              B: { value: b, won: b > a, lost: a > b }
            });
          });

          const currentIndex = (data.completedSets || []).length + 1;
          if (!data.matchComplete)
          {
            columns.push({
              label: "Set " + currentIndex,
              A: { value: data.teams.A.games },
              B: { value: data.teams.B.games }
            });
          }
        }

        if (mode !== "standard" || !data.matchComplete)
        {
          const label = mode !== "standard" ? "Pts" : (data.inTiebreak ? "TB" : "Game");
          columns.push({
            label,
            A: { value: data.teams.A.pointsDisplay, highlight: true },
            B: { value: data.teams.B.pointsDisplay, highlight: true }
          });
        }

        return columns;
      }

      function render(data)
      {
        latestScore = data;

        document.getElementById("loadingLine").classList.add("hidden");
        document.getElementById("scoreBody").classList.remove("hidden");
        const displayCourtId = data.courtId || courtId || "";
        document.getElementById("courtLabel").textContent =
          displayCourtId ? "Join: " + displayCourtId.toUpperCase() : "";

        const server = settings.showServer ? (data.server || "") : "";

        ["A", "B"].forEach((team) =>
        {
          const teamName = settings["name" + team] || data.teamNames[team] || ("Team " + team);
          const nameEl = document.getElementById("name" + team);
          nameEl.textContent = teamName;

          let hasAnyPlayer = false;

          [1, 2].forEach((index) =>
          {
            const slot = team + index;
            const playerName = getPlayerName(slot, data);
            const line = document.getElementById("line" + slot);

            line.classList.toggle("hidden", !playerName);
            document.getElementById("player" + slot).textContent = playerName;
            document.getElementById("dot" + slot).classList.toggle("serving", server === slot);

            if (playerName) hasAnyPlayer = true;
          });

          nameEl.classList.toggle("primary", !hasAnyPlayer);
        });

        const columns = buildColumns(data);
        setHeadCells(columns.map((column) => column.label));
        ["A", "B"].forEach((team) => setCells("cells" + team, columns.map((column) => column[team])));

        const statusLine = document.getElementById("statusLine");
        if (data.matchComplete)
        {
          statusLine.textContent = "Match complete";
          statusLine.classList.add("visible");
        }
        else
        {
          statusLine.textContent = "";
          statusLine.classList.remove("visible");
        }
      }

      function showError(message)
      {
        document.getElementById("loadingLine").classList.add("hidden");
        const statusLine = document.getElementById("statusLine");
        statusLine.textContent = message;
        statusLine.classList.add("visible");
      }

      async function fetchJson(path)
      {
        const response = await fetch(path, { cache: "no-store" });
        let data = null;

        try
        {
          data = await response.json();
        }
        catch (_parseErr) { /* non-JSON body */ }

        if (!response.ok || !data || !data.success)
        {
          throw new Error((data && data.error) || "Could not load score.");
        }

        return data;
      }

      async function loadFullScore()
      {
        const url = isDebugCourt ? debugCourt_fullScoreUrl : "/a/" + encodeURIComponent(courtId);
        const data = await fetchJson(url);
        render(data);
        // Trust the revision that shipped with this payload rather than the one
        // that triggered the fetch, so a change landing mid-request is not
        // mistaken for already-rendered state on the next poll.
        renderedRevision = data.revision || null;
      }

      async function poll()
      {
        if (!courtId)
        {
          showError("No court specified. Use /b/{courtId}.");
          return;
        }

        if (isPolling) return;
        isPolling = true;

        try
        {
          const revisionUrl = isDebugCourt ? debugCourt_revisionUrl : "/r/" + encodeURIComponent(courtId);
          const revisionData = await fetchJson(revisionUrl);

          if (revisionData.revision && revisionData.revision === renderedRevision)
          {
            if (latestScore) render(latestScore);
            return;
          }

          await loadFullScore();
        }
        catch (err)
        {
          showError(err.message === "Failed to fetch" ? "Connection lost. Retrying…" : err.message);
        }
        finally
        {
          isPolling = false;
        }
      }

      // ---------- Settings UI wiring ----------
      const fieldMap = {
        setPanel: "panel",
        setText: "text",
        setTeamA: "teamA",
        setTeamB: "teamB",
        setAccent: "accent",
        setNameA: "nameA",
        setNameB: "nameB",
        setPlayerA1: "playerA1",
        setPlayerA2: "playerA2",
        setPlayerB1: "playerB1",
        setPlayerB2: "playerB2",
        setLogoA: "logoA",
        setLogoB: "logoB"
      };

      function syncInputsFromSettings()
      {
        Object.entries(fieldMap).forEach(([inputId, key]) =>
        {
          document.getElementById(inputId).value = settings[key];
        });

        document.getElementById("setShowServer").checked = settings.showServer !== false;
      }

      Object.entries(fieldMap).forEach(([inputId, key]) =>
      {
        document.getElementById(inputId).addEventListener("input", (event) =>
        {
          settings[key] = key.startsWith("logo") ? event.target.value.trim() : event.target.value;
          saveSettings();
          applySettings();
        });
      });

      document.getElementById("setShowServer").addEventListener("change", (event) =>
      {
        settings.showServer = event.target.checked;
        saveSettings();
        applySettings();
      });

      const gearBtn = document.getElementById("gearBtn");
      const settingsPanel = document.getElementById("settingsPanel");

      gearBtn.addEventListener("click", () =>
      {
        settingsPanel.classList.toggle("open");
      });

      document.getElementById("closeSettings").addEventListener("click", () =>
      {
        settingsPanel.classList.remove("open");
      });

      document.getElementById("resetSettings").addEventListener("click", () =>
      {
        settings = { ...DEFAULT_SETTINGS };
        saveSettings();
        syncInputsFromSettings();
        applySettings();
      });

      // ---------- Boot ----------
      loadSettings();
      syncInputsFromSettings();
      applySettings();
      void poll();
      setInterval(poll, POLL_INTERVAL_MS);
    })();
  </script>
</body>

</html>
