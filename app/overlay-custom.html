<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Padel Push — Custom Score Overlay</title><link rel="icon" href="/app/media/img/favicon.svg"><script src="/app/js/qrcode.min.js"></script><style>:root{--s:1;--ss:1;--a:#b7f000;--b:#27d9ff;--t:#fff;--m:#8f969e;--p:rgba(0,0,0,.82);--p2:rgba(0,0,45,.82)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--t);font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}.drag{position:fixed;z-index:10;cursor:move;user-select:none}.panel{background:linear-gradient(90deg,var(--p),var(--p2));border:1px solid rgba(255,255,255,.18);border-radius:.8em;box-shadow:0 10px 35px rgba(0,0,0,.4)}#score{left:16px;top:16px;font-size:calc(24px*var(--s));min-width:16em}.brand{padding:.5em 1em;border-bottom:1px solid rgba(255,255,255,.14);display:flex;gap:.5em;align-items:center}.brand img{width:1.5em;height:1.5em}.court{margin-left:auto;color:var(--m);font-size:.65em}.row,.head{display:grid;grid-template-columns:11em auto;align-items:center;gap:.8em;padding:0 1em}.row{min-height:3.8em;border-top:1px solid rgba(255,255,255,.08)}.head{padding-top:.35em}.team{font-weight:900}.a{color:var(--a)}.b{color:var(--b)}.player{font-size:.7em;white-space:nowrap}.cells{display:flex}.cell{width:calc(60px*var(--s));height:calc(60px*var(--s));display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.12);font-weight:700}.head .cell{height:auto;border:0;font-size:.5em;color:var(--m)}.pts{margin-left:.6rem;border:1px solid currentColor;border-radius:.2em}.hidden{display:none!important}#stats{left:16px;top:300px;width:340px;padding:12px;font-size:16px}.stathead{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:5px;margin-bottom:7px}.muted{color:var(--m)}.stat{margin-bottom:7px;font-size:.75em}.vals{display:flex;justify-content:space-between}.bar{display:flex;height:4px;background:rgba(255,255,255,.08)}.bar i{display:block;height:100%}.ma{background:var(--a)}.mb{background:var(--b);margin-left:auto}.momentum{border-top:1px solid rgba(255,255,255,.14);margin-top:9px;padding-top:7px}.momentum canvas{width:100%;height:120px;display:block}#slate{left:50%;top:75%;transform:translate(-50%,-50%);font-size:calc(25px*var(--ss));padding:14px 24px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}#slate.show{opacity:1;pointer-events:auto}#qr{right:16px;bottom:16px;background:#fff;padding:8px;border-radius:8px;color:#111}.qr{position:relative}.qr-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;height:24%;background:#fff;border-radius:5px;padding:2px}.qrlabel{font-size:11px;text-align:center;margin-top:4px}.tools{right:12px;bottom:12px;display:flex;gap:8px;z-index:40}.tools button{width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;cursor:move}.tools button.gear{cursor:pointer}.settings{right:12px;bottom:60px;width:340px;max-height:calc(100vh - 90px);overflow:auto;padding:14px;background:rgba(10,10,10,.96);border-radius:12px;display:none;z-index:50}.settings.open{display:block}.settings label{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;margin:6px 0}.settings input,.settings select,.settings textarea{min-width:0;max-width:190px;flex:1;background:#1a1a1a;color:#fff;border:1px solid #444;border-radius:6px;padding:4px}.settings .full{width:100%;max-width:none}.section{margin:10px 0 5px;text-transform:uppercase;font-size:10px;letter-spacing:1px;color:#888}.settings button{border:0;border-radius:6px;padding:7px;background:#2b60bc;color:#fff}.rowbtn{display:flex;gap:8px}.rowbtn>*{flex:1}.settings input[type=checkbox]{flex:0 0 auto}.settings input[type=range]{max-width:150px}</style></head><body>
<div id="score" class="drag panel"><div class="brand"><img id="brandLogo" src="/app/media/img/logo.svg"><b id="brandText">Padel Push</b><span id="court" class="court"></span></div><div id="loading">Loading…</div><div id="scoreBody" class="hidden"><div class="head"><div></div><div class="cells" id="h"></div></div><div class="row"><div><div id="nameA" class="team a">Team A</div><div id="pA1" class="player"></div><div id="pA2" class="player"></div></div><div class="cells" id="a"></div></div><div class="row"><div><div id="nameB" class="team b">Team B</div><div id="pB1" class="player"></div><div id="pB2" class="player"></div></div><div class="cells" id="b"></div></div></div></div>
<div id="stats" class="drag panel hidden"><div class="stathead"><b>Match stats</b><span id="sub" class="muted"></span></div><div id="statRows"></div><div id="momentum" class="momentum"><div class="muted" style="font-size:11px;margin-bottom:2px">Momentum</div><canvas id="canvas"></canvas></div></div>
<div id="slate" class="drag panel"><div class="section">Brought to you by</div><div id="slateBody"></div></div>
<div id="qr" class="drag hidden"><div class="qr" id="qrCode"></div><div id="qrLabel" class="qrlabel"></div></div>
<div id="tools" class="tools drag"><button id="statsBtn">📊</button><button id="slateBtn">🎬</button><button id="gear" class="gear">⚙</button></div>
<div id="settings" class="settings drag"><div style="display:flex;align-items:center;gap:8px"><button id="close">×</button><b>Customise overlay</b></div><div class="section">Scale</div><label>Score scale <input id="scale" type="range" min=".5" max="2" step=".05"><span id="sv">100%</span></label><label>Sponsor slate scale <input id="slateScale" type="range" min=".5" max="2" step=".05"><span id="ssv">100%</span></label><div class="section">Display</div><label>Show momentum <input id="showMomentum" type="checkbox"></label><label>Show QR <input id="showQr" type="checkbox"></label><div class="section">Brand</div><label>Brand text <input id="brandInput"></label><label>Logo URL <input id="logoInput"></label><div class="section">Sponsor</div><textarea id="sponsorInput" rows="3" class="full"></textarea><div class="section">QR</div><label>URL <input id="qrUrl"></label><label>Label <input id="qrText"></label><label>Size <input id="qrSize" type="range" min="64" max="200" step="4"><span id="qsv">96px</span></label><div class="section">Share</div><button id="copy" class="full">Copy OBS URL</button><input id="obsUrl" class="full" readonly><div class="rowbtn"><button id="reset">Reset</button><button id="done">Done</button></div></div>
<script>
(()=>{const D={scale:1,slateScale:1,showMomentum:true,showQr:false,brandText:'Padel Push',logo:'',sponsor:'Live scores brought to you by <strong>Padel Push</strong>. Visit <strong>padelpush.co.za</strong>.',qrUrl:'',qrText:'Scan for live scores',qrSize:96,pos:{}};const cid=location.pathname.split('/').filter(Boolean).at(-1);const KEY='padelPushCustomOverlay:'+(cid||'default');let s={...D},score=null,stats=null,rev=null,raf=null,busy=false;const $=id=>document.getElementById(id);const clamp=(v,a,b,d)=>Number.isFinite(Number(v))?Math.min(b,Math.max(a,Number(v))):d;function load(){try{s={...D,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function safe(v){try{const u=new URL(v||'',location.origin);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}function setPos(id,node){const r=node.getBoundingClientRect();s.pos[id]={x:r.left/innerWidth,y:r.top/innerHeight};save()}function drag(node,id){let sx,sy,l,t,m=false;node.addEventListener('pointerdown',e=>{if(e.target.closest('input,select,textarea,button'))return;node.setPointerCapture(e.pointerId);const r=node.getBoundingClientRect();sx=e.clientX;sy=e.clientY;l=r.left;t=r.top;m=true});node.addEventListener('pointermove',e=>{if(!m)return;node.style.left=l+e.clientX-sx+'px';node.style.top=t+e.clientY-sy+'px';node.style.right='auto';node.style.bottom='auto';if(id==='slate')node.style.transform='none'});node.addEventListener('pointerup',()=>{if(m){m=false;setPos(id,node)}})}function applyPos(){for(const id of ['score','stats','slate','qr','settings']){const p=s.pos[id];const n=$(id);if(p){n.style.left=p.x*100+'vw';n.style.top=p.y*100+'vh';n.style.right='auto';n.style.bottom='auto';if(id==='slate')n.style.transform='none'}}}function share(){const p=new URLSearchParams();for(const [k,v] of Object.entries(s))if(JSON.stringify(v)!==JSON.stringify(D))p.set(k,typeof v==='object'?JSON.stringify(v):String(v));return location.origin+'/b/'+encodeURIComponent(cid||'')+(p.toString()?'?'+p.toString():'')}function applyUrl(){const p=new URLSearchParams(location.search);for(const k of Object.keys(D))if(p.has(k))try{s[k]=typeof D[k]==='boolean'?p.get(k)!=='false':typeof D[k]==='number'?Number(p.get(k)):typeof D[k]==='object'?JSON.parse(p.get(k)):p.get(k)}catch{}}function apply(){document.documentElement.style.setProperty('--s',clamp(s.scale,.5,2,1));document.documentElement.style.setProperty('--ss',clamp(s.slateScale,.5,2,1));$('brandText').textContent=s.brandText||'Padel Push';$('brandLogo').src=safe(s.logo)||'/app/media/img/logo.svg';$('scale').value=s.scale;$('slateScale').value=s.slateScale;$('sv').textContent=Math.round(s.scale*100)+'%';$('ssv').textContent=Math.round(s.slateScale*100)+'%';$('showMomentum').checked=s.showMomentum!==false;$('showQr').checked=!!s.showQr;$('brandInput').value=s.brandText||'';$('logoInput').value=s.logo||'';$('sponsorInput').value=s.sponsor||'';$('qrUrl').value=s.qrUrl||'';$('qrText').value=s.qrText||'';$('qrSize').value=s.qrSize;$('qsv').textContent=Math.round(s.qrSize)+'px';$('slateBody').innerHTML=(s.sponsor||'').replaceAll('{courtId}',String(cid||'').toUpperCase());renderQr();applyPos();if(score)render(score)}async function json(u){const r=await fetch(u,{cache:'no-store'}),d=await r.json().catch(()=>null);if(!r.ok||!d?.success)throw Error(d?.error||'Request failed');return d}function cells(id,arr){const n=$(id);n.innerHTML='';for(const x of arr){const d=document.createElement('div');d.className='cell'+(x.highlight?' pts '+(id==='a'?'a':'b'):'');d.textContent=x.value;n.appendChild(d)}}function render(d){score=d;$('loading').classList.add('hidden');$('scoreBody').classList.remove('hidden');$('court').textContent=d.courtId?'Join: '+String(d.courtId).toUpperCase():'';for(const t of ['A','B']){$('name'+t).textContent=d.teamNames?.[t]||('Team '+t);const p=d.playerNames||{};$('p'+t+'1').textContent=p[t+'1']||'';$('p'+t+'2').textContent=p[t+'2']||''}const cols=[];(d.completedSets||[]).forEach((x,i)=>cols.push({l:'S'+(i+1),A:{value:x.A},B:{value:x.B}}));if(!d.matchComplete)cols.push({l:'S'+((d.completedSets||[]).length+1),A:{value:d.teams.A.games},B:{value:d.teams.B.games}});if(!d.matchComplete||d.scoringMode!=='standard')cols.push({l:d.inTiebreak?'TB':'PTS',A:{value:d.teams.A.pointsDisplay,highlight:true},B:{value:d.teams.B.pointsDisplay,highlight:true}});cells('h',cols.map(x=>({value:x.l})));cells('a',cols.map(x=>x.A));cells('b',cols.map(x=>x.B))}function stat(label,a,b,wa,wb){const t=(wa||0)+(wb||0),pa=t?Math.round(wa/t*98):49;return `<div class=stat><div class=vals><span class=a>${a}</span><span class=muted>${label}</span><span class=b>${b}</span></div><div class=bar><i class=ma style="width:${pa}%"></i><i class=mb style="width:${98-pa}%"></i></div></div>`}function graph(data){const wrap=$('momentum');if(s.showMomentum===false||!data?.pointHistory?.length){wrap.classList.add('hidden');return}wrap.classList.remove('hidden');const c=$('canvas');if(raf)cancelAnimationFrame(raf);const draw=ts=>{const dpr=devicePixelRatio||1,W=c.clientWidth||320,H=120;c.width=W*dpr;c.height=H*dpr;const x=8,mid=H/2,py=10,vals=Array.isArray(data.momentumTimeline)&&data.momentumTimeline.length===data.pointHistory.length?[0,...data.momentumTimeline.map(v=>clamp(v,-100,100,0))]:[0,...data.pointHistory.reduce((a,p)=>(a.push(a.at(-1)+(p==='A'?1:-1)),a),[])],max=Math.max(...vals.map(v=>Math.abs(v)),1),X=i=>x+i/(vals.length-1)*(W-x*2),Y=v=>mid-v/max*(mid-py),pts=vals.map((v,i)=>[X(i),Y(v)]);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(140,140,140,.45)';ctx.beginPath();ctx.moveTo(x,mid);ctx.lineTo(W-x,mid);ctx.stroke();const path=new Path2D();path.moveTo(...pts[0]);for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;path.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}if(pts.length>1)path.quadraticCurveTo(...pts.at(-2),...pts.at(-1));ctx.save();ctx.beginPath();ctx.rect(0,0,W,mid);ctx.clip();ctx.strokeStyle='#b7f000';ctx.lineWidth=2;ctx.stroke(path);ctx.restore();ctx.save();ctx.beginPath();ctx.rect(0,mid,W,H-mid);ctx.clip();ctx.strokeStyle='#27d9ff';ctx.lineWidth=2;ctx.stroke(path);ctx.restore();const last=pts.at(-1),v=vals.at(-1),col=v>0?'#b7f000':v<0?'#27d9ff':'#fff',pulse=4+(Math.sin((ts||performance.now())/320)+1)*1.6;ctx.beginPath();ctx.arc(last[0],last[1],pulse,0,Math.PI*2);ctx.strokeStyle=col;ctx.globalAlpha=.3;ctx.stroke();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(last[0],last[1],3.5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();if(c.isConnected&&!wrap.classList.contains('hidden'))raf=requestAnimationFrame(draw)};raf=requestAnimationFrame(draw)}async function loadStats(){if(!cid)return;stats=await json('/s/'+encodeURIComponent(cid));const t=stats.advancedStats?.teamStats||{A:{},B:{}},m=stats.advancedStats?.matchStats||{};$('sub').textContent=(score?.teamNames?.A||'Team A')+' vs '+(score?.teamNames?.B||'Team B');let h='';const A=Number(t.A.pointsWon)||0,B=Number(t.B.pointsWon)||0;if(m.totalPoints||A||B)h+=stat('Points won',A,B,A,B);h&&($('statRows').innerHTML=h);graph(stats)}function renderQr(){const q=$('qr');q.classList.toggle('hidden',!s.showQr||!window.QRCode);if(!s.showQr||!window.QRCode)return;const mount=$('qrCode');mount.innerHTML='';const wrap=document.createElement('div');wrap.className='qr';mount.appendChild(wrap);const size=Math.round(clamp(s.qrSize,64,200,96));new QRCode(wrap,{text:safe(s.qrUrl)||location.origin+'/c/'+encodeURIComponent(cid||''),width:size,height:size,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});const logo=document.createElement('img');logo.className='qr-logo';logo.src='/app/media/img/logo.svg';wrap.appendChild(logo);$('qrLabel').textContent=s.qrText||''}function wire(){for(const [id,k] of [['scale','scale'],['slateScale','slateScale'],['showMomentum','showMomentum'],['showQr','showQr'],['brandInput','brandText'],['logoInput','logo'],['sponsorInput','sponsor'],['qrUrl','qrUrl'],['qrText','qrText']])$(id).addEventListener('input',e=>{s[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(k==='scale'||k==='slateScale')s[k]=clamp(s[k],.5,2,1);if(k==='qrSize')s.qrSize=clamp(s.qrSize,64,200,96);save();apply()});$('qrSize').addEventListener('input',e=>{s.qrSize=clamp(e.target.value,64,200,96);save();apply()});$('statsBtn').addEventListener('click',async()=>{$('stats').classList.toggle('hidden');if(!$('stats').classList.contains('hidden'))try{await loadStats()}catch{}});$('slateBtn').addEventListener('click',()=>{$('slate').classList.add('show');setTimeout(()=>$('slate').classList.remove('show'),8000)});$('gear').addEventListener('click',()=>$('settings').classList.toggle('open'));$('close').addEventListener('click',()=>$('settings').classList.remove('open'));$('done').addEventListener('click',()=>$('settings').classList.remove('open'));$('copy').addEventListener('click',async()=>{const u=share();$('obsUrl').value=u;try{await navigator.clipboard.writeText(u)}catch{}});$('reset').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch{}s={...D,pos:{}};save();apply()});for(const [id,key] of [['score','score'],['stats','stats'],['slate','slate'],['qr','qr'],['settings','settings']])drag($(id),key)}load();applyUrl();apply();wire();if(cid){json('/a/'+encodeURIComponent(cid)).then(d=>render(d)).catch(e=>{$('loading').textContent=e.message});setInterval(async()=>{if(busy)return;busy=true;try{const r=await json('/r/'+encodeURIComponent(cid));if(r.revision&&r.revision===rev){}else{const d=await json('/a/'+encodeURIComponent(cid));rev=d.revision||r.revision;render(d)}}finally{busy=false}},2000)}addEventListener('resize',applyPos)})();</script></body></html>
