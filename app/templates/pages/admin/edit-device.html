    <div id="editDevicePage" style="display:none;" class="create-page">
      <div class="create-card">
        <button id="closeEditDeviceBtn" class="close-btn">✕</button>
        <h2><span id="editDeviceIdTitle"></span></h2>
        <div class="form-group">
          <label>Mapped Court ID</label>
          <div class="court-id-combo" id="editCourtIdCombo">
            <div class="select-wrapper">
              <select id="editDeviceCourtIdSelect">
                <option value="">— Select a court —</option>
              </select>
            </div>
            <div class="combo-manual-row">
              <a href="#" class="combo-toggle-link" id="editDeviceManualToggle">Enter ID manually instead</a>
            </div>
            <input type="text" id="editDeviceCourtIdManual" placeholder="e.g. court-123" class="combo-manual-input"
              style="display:none;" />
            <div class="combo-manual-row" id="editDeviceDropdownToggleRow" style="display:none;">
              <a href="#" class="combo-toggle-link" id="editDeviceDropdownToggle">← Choose from list</a>
            </div>
          </div>
        </div>
        <button id="saveEditDeviceBtn" class="primary-btn">Save Mapping</button>
        <hr />
        <button id="deleteDeviceBtn" class="danger-btn" style="margin-top: 10px; background: #ff4444;">Delete
          Device</button>
      </div>
    </div>
