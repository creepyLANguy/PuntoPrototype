    <!-- ================= CREATE COURT MODAL ================= -->
    <div id="createPage" style="display:none;" class="create-page">
      <div class="create-card">
        <button id="closeCreateBtn" class="close-btn">✕</button>
        <h2>Add Court</h2>
        <div class="form-group">
          <label>Court Name</label>
          <input type="text" id="courtName" />
          <div class="error" id="courtNameError"></div>
        </div>
        <div class="form-group">
          <label>Court Password</label>
          <input type="password" id="courtPassword" />
          <div class="error" id="courtPasswordError"></div>
        </div>
        <div class="form-group">
          <label>Status</label>
          <div class="select-wrapper">
            <select id="courtStatus">
              <option value="open">🟢 Open</option>
              <option value="closed">🔴 Closed</option>
              <option value="private">🔵 Private</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Scoring Mode</label>
          <div class="select-wrapper">
            <select id="courtScoringMode">
              <option value="standard">Games and sets</option>
              <option value="fixedTotalPoints">Fixed total points</option>
              <option value="straight">Straight points</option>
              <option value="tiebreakTen">Tiebreak Tens</option>
            </select>
          </div>
        </div>
        
        <div class="fixed-scoring-options" id="courtFixedScoringOptions">
          <div class="form-group">
            <label>Total Points Target</label>
            <input id="courtFixedPointsTarget" type="number" min="1" max="500" step="1" value="36" />
          </div>
          <div class="form-group">
            <label>Serve Order</label>
            <input id="courtFixedServeOrder" type="text" value="A1, B1, A2, B2" placeholder="A1, B1, A2, B2" autocomplete="off" />
          </div>
          <div class="form-group">
            <label>Consecutive Serves</label>
            <input id="courtFixedServeBlockLength" type="number" min="1" max="20" step="1" value="1" />
          </div>
          <div class="form-group">
            <label>Changeover</label>
            <div class="select-wrapper">
              <select id="courtFixedSideSwapRule">
                <option value="after_all_players_serve_once">After all players serve once</option>
                <option value="none">Never automatically</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Tie Resolution</label>
            <div class="select-wrapper">
              <select id="courtFixedTieResolution">
                <option value="allow_draw">Allow draw</option>
                <option value="golden_point">Golden point</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>Deuce Mode</label>
          <div class="select-wrapper">
            <select id="courtDeuceMode">
              <option value="standard">Advantage</option>
              <option value="golden">Golden point</option>
              <option value="silver">Silver deuce</option>
              <option value="star">Star point</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Tiebreak Mode</label>
          <div class="select-wrapper">
            <select id="courtTiebreakMode">
              <option value="sixAllSeven">7-point at 6-all (win by 2)</option>
              <option value="sixAllTen">10-point at 6-all (win by 2)</option>
              <option value="off">Off</option>
            </select>
          </div>
        </div>
        <p>
          <button id="createCourtBtn" class="primary-btn">Add Court</button>
      </div>
    </div>
