    <!-- ================= ADMIN PORTAL PAGE ================= -->
    <div id="adminDashboardPage" style="display:none;" class="create-page">
      <div class="admin-dashboard-container">
        <div class="admin-dashboard-header">
          <button id="closeAdminDashboardBtn" class="close-btn">✕</button>
          <h2>Admin Portal</h2>
          <div class="header-actions">
            <button id="nfcToolBtn" class="primary-btn">NFC Tool</button>
            <button id="deviceHarnessBtn" class="primary-btn">Device Lab</button>
          </div>
        </div>

        <div class="admin-tabs">
          <button type="button" class="tab-btn admin-all-tab-btn active" data-tab="all" aria-label="All admin tools" title="All admin tools">
            <img src="/media/logo.svg" alt="Padel Push™" class="admin-all-tab-logo" />
          </button>
          <button class="tab-btn" data-tab="tournaments">Tournaments</button>
          <button class="tab-btn" data-tab="clubs">Clubs</button>
          <button class="tab-btn" data-tab="courts">Courts</button>
          <button class="tab-btn" data-tab="matches">Matches</button>
          <button class="tab-btn" data-tab="devices">Devices</button>
        </div>

        <div id="allTab" class="tab-content active">
          <div class="admin-tool-grid" aria-label="Admin portal tools">
          <button type="button" class="admin-tool-tile" data-tab="tournaments"><svg class="admin-tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4M12 13v5M8 21h8M10 18h4"/></svg><span class="admin-tool-copy"><span class="admin-tool-label">Tournaments</span><span class="admin-tool-description">Manage events and formats</span></span></button>
          <button type="button" class="admin-tool-tile" data-tab="clubs"><svg class="admin-tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg><span class="admin-tool-copy"><span class="admin-tool-label">Clubs</span><span class="admin-tool-description">Organise venues and memberships</span></span></button>
          <button type="button" class="admin-tool-tile" data-tab="courts"><svg class="admin-tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3.5" width="18" height="17" rx="1.5"/><path d="M12 3.5v17M3 8h18M3 16h18M9 8v8M15 8v8"/></svg><span class="admin-tool-copy"><span class="admin-tool-label">Courts</span><span class="admin-tool-description">Configure courts and availability</span></span></button>
          <button type="button" class="admin-tool-tile" data-tab="matches"><svg class="admin-tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 8h3M7 12h3M14 8h3M14 12h3M12 18v3M8 21h8"/></svg><span class="admin-tool-copy"><span class="admin-tool-label">Matches</span><span class="admin-tool-description">Review live and scheduled matches</span></span></button>
          <button type="button" class="admin-tool-tile" data-tab="devices"><svg class="admin-tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3M10 10h4v4h-4z"/></svg><span class="admin-tool-copy"><span class="admin-tool-label">Devices</span><span class="admin-tool-description">Manage registered hardware</span></span></button>
          <button type="button" class="admin-tool-tile" data-admin-tool="nfc"><svg class="admin-tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 8.5a5 5 0 0 0 0 7M5 5.5a9 9 0 0 0 0 13M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13"/><circle cx="12" cy="12" r="1.5"/></svg><span class="admin-tool-copy"><span class="admin-tool-label">NFC Tool</span><span class="admin-tool-description">Scan and verify NFC devices</span></span></button>
          <button type="button" class="admin-tool-tile" data-admin-tool="harness"><svg class="admin-tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="8" width="6" height="8" rx="1.5"/><rect x="15" y="8" width="6" height="8" rx="1.5"/><path d="M9 12h6M6 5v3M18 5v3M6 16v3M18 16v3M9 10l2-2h2l2 2"/></svg><span class="admin-tool-copy"><span class="admin-tool-label">Device Harness</span><span class="admin-tool-description">Test device behaviour and flows</span></span></button>
          <button type="button" class="admin-tool-tile" data-admin-tool="theme"><svg class="admin-tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a9 9 0 1 0 0 18h1.2a2.1 2.1 0 0 0 1.6-3.5 1.7 1.7 0 0 1 1.3-2.8H18A3 3 0 0 0 21 11c0-4.4-4-8-9-8Z"/><circle cx="7.5" cy="11" r=".8"/><circle cx="10" cy="7.5" r=".8"/><circle cx="15" cy="8" r=".8"/><circle cx="17" cy="11.5" r=".8"/></svg><span class="admin-tool-copy"><span class="admin-tool-label">Theme selector</span><span class="admin-tool-description">Adjust theme and team colours</span></span></button>
        </div>
        </div>

        <div id="tournamentsTab" class="tab-content">
          <div class="admin-dashboard-controls">
            <div class="search-wrapper">
              <input type="text" id="adminTournamentSearch" placeholder="Search tournament, club or ID..." />
            </div>
            <a id="showCreateTournamentBtn" class="primary-btn" href="/t/new">Add Tournament</a>
          </div>
          <div id="adminTournamentList" class="admin-court-list"></div>
        </div>

        <div id="clubsTab" class="tab-content">
          <div class="admin-dashboard-controls">
            <div class="search-wrapper">
              <input type="text" id="adminClubSearch" placeholder="Search club name or ID..." />
            </div>
            <button id="showCreateClubBtn" class="primary-btn">Add Club</button>
          </div>
          <div id="adminClubList" class="admin-court-list"></div>
        </div>

        <div id="courtsTab" class="tab-content active">
          <div class="admin-dashboard-controls">
            <div class="search-wrapper">
              <input type="text" id="adminCourtSearch" placeholder="Search courts or clubs..." />
            </div>
            <div class="filter-wrapper">
              <select id="adminStatusFilter">
                <option value="all">⚪ All</option>
                <option value="open">🟢 Open</option>
                <option value="closed">🔴 Closed</option>
                <option value="private">🔵 Private</option>
              </select>
            </div>
            <button id="showCreateCourtModalBtn" class="primary-btn">Add Court</button>
          </div>
          <div id="adminCourtList" class="admin-court-list"></div>
        </div>

        <div id="matchesTab" class="tab-content">
          <div class="admin-dashboard-controls">
            <div class="search-wrapper">
              <input type="text" id="adminMatchSearch" placeholder="Search match, player, court or tournament..." />
            </div>
            <div class="filter-wrapper">
              <select id="adminMatchStatusFilter">
                <option value="live">Live</option>
                <option value="scheduled">Scheduled</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <button id="showAddMatchBtn" class="primary-btn">Add Match</button>
          </div>

          <div id="adminMatchCreatePanel" class="admin-match-create-panel hidden" aria-label="Add match">
            <div class="admin-match-create-grid">
              <label>
                <span>Match name</span>
                <input id="adminMatchName" type="text" maxlength="80" placeholder="Optional match name" />
              </label>
              <label>
                <span>Court</span>
                <select id="adminMatchCourt"></select>
              </label>
              <label>
                <span>Team A</span>
                <input id="adminMatchTeamA" type="text" maxlength="40" placeholder="Team A" />
              </label>
              <label>
                <span>Team B</span>
                <input id="adminMatchTeamB" type="text" maxlength="40" placeholder="Team B" />
              </label>
            </div>
            <div class="admin-match-create-actions">
              <button id="cancelAddMatchBtn" class="edit-btn" type="button">Cancel</button>
              <button id="saveAddMatchBtn" class="primary-btn" type="button">Add Match</button>
            </div>
          </div>

          <div id="adminMatchList" class="admin-court-list"></div>
        </div>

        <div id="devicesTab" class="tab-content">
          <div class="admin-dashboard-controls">
            <div class="search-wrapper">
              <input type="text" id="adminDeviceSearch" placeholder="Search device, court or club..." />
            </div>
            <button id="showAddDeviceModalBtn" class="primary-btn">Add Device</button>
          </div>
          <div id="adminDeviceList" class="admin-court-list">
          </div>
        </div>
      </div>
    </div>
