    <!-- ================= SETTINGS MODAL ================= -->
    <div id="settingsModal" class="reset-modal hidden">
      <div class="settings-box">
        <button id="closeSettingsBtn" class="close-btn" type="button" title="Close settings"
          aria-label="Close settings"><span class="icon icon--close" aria-hidden="true"></span></button>
        <h2>Options</h2>
        <div class="settings-grid">
          <section class="settings-group" id="settingsDisplayGroup" aria-label="Display and appearance">
            <div class="setting-item">
              <button id="muteBtn" class="floating-btn modal-btn" title="Mute" aria-label="Mute audio">
                <span class="icon icon--music" aria-hidden="true"></span>
              </button>
              <span>Mute</span>
            </div>
              <div class="setting-item">
              <button id="waveToggleScoreboardBtn" class="floating-btn modal-btn" title="Toggle waves"
                aria-label="Toggle scoreboard waves"><span class="icon icon--waves" aria-hidden="true"></span></button>
              <span>Waves</span>
            </div>
              <div class="setting-item" id="courtQrToggleTile">
              <button id="courtQrToggleBtn" class="floating-btn modal-btn" title="Show QR panel"
                aria-label="Show QR panel" aria-pressed="false" disabled>
                <span class="icon icon--qr" aria-hidden="true"></span>
              </button>
              <span>Show QR</span>
            </div>
              <div class="setting-item">
              <button id="fullscreenBtn" class="floating-btn modal-btn" title="Enter fullscreen"
                aria-label="Enter fullscreen"><span class="icon icon--fullscreen" aria-hidden="true"></span></button>
              <span id="fullscreenLabel">Fullscreen</span>
            </div>
              <div class="setting-item">
              <button id="swapBtn" class="floating-btn modal-btn" title="Swap views" aria-label="Swap views">
                <span class="icon icon--swap" aria-hidden="true"></span>
              </button>
              <span>Swap views</span>
            </div>
          </section>
          <div class="settings-group-divider" role="separator" aria-orientation="horizontal" aria-hidden="true" hidden></div>
          <section class="settings-group" id="settingsCourtGroup" aria-label="Court controls">
            <div class="setting-item player-only-tile" id="changeoverTile">
              <button id="changeoverBtn" class="floating-btn modal-btn" title="Changeover"
                aria-label="Changeover"><span class="icon icon--changeover" aria-hidden="true"></span></button>
              <span>Changeover</span>
            </div>
              <div class="setting-item player-only-tile" id="serverToggleTile">
              <button id="serverToggleBtn" class="floating-btn modal-btn" title="Toggle server indicator"
                aria-label="Toggle server indicator"><span class="icon icon--server" aria-hidden="true"></span></button>
              <span>Server</span>
            </div>
              <div class="setting-item player-only-tile" id="editPlayersTile">
              <button id="editPlayersBtn" class="floating-btn modal-btn player-names" title="Edit player names"
                aria-label="Edit player names"><span class="icon icon--users" aria-hidden="true"></span></button>
              <span>Players/Teams</span>
            </div>
              <div class="setting-item player-only-tile" id="resetSettingsTile">
              <button id="resetSettingsBtn" class="floating-btn modal-btn reset-tile-btn" title="Reset match"
                aria-label="Reset match"><span class="icon icon--reset" aria-hidden="true"></span></button>
              <span>Reset</span>
            </div>
              <div class="setting-item player-only-tile" id="newMatchTile" style="display:none;">
              <button id="newMatchBtn" class="floating-btn modal-btn" title="New Match" aria-label="New Match">
                <span class="icon icon--plus" aria-hidden="true"></span>
              </button>
              <span>New Match</span>
            </div>
          </section>
          <div class="settings-group-divider" role="separator" aria-orientation="horizontal" aria-hidden="true" hidden></div>
          <section class="settings-group" id="settingsSharingGroup" aria-label="Sharing and access">
            <div class="setting-item" id="obsOverlayTile">
              <button id="obsOverlayBtn" class="floating-btn modal-btn" title="Open OBS score overlay"
                aria-label="Open OBS score overlay"><span class="icon icon--monitor" aria-hidden="true"></span></button>
              <span>OBS Overlay</span>
            </div>
              <div class="setting-item" id="joinCourtTile" style="display:none;">
              <button id="joinCourtBtn" class="floating-btn modal-btn join-as-player-btn" title="Join as player"
                aria-label="Join as a player">
                <span class="icon icon--player" aria-hidden="true"></span>
              </button>
              <span>Join as a player</span>
            </div>
              <div class="setting-item" id="switchToSpectateTile" style="display:none;">
              <button id="switchToSpectateBtn" class="floating-btn modal-btn" title="Switch to spectate mode"
                aria-label="Switch to spectate mode"><span class="icon icon--eye" aria-hidden="true"></span></button>
              <span>Switch to spectate mode</span>
            </div>
          </section>
        </div>
        <div class="settings-scoring">
          <h3>Scoring</h3>
          <label class="scoring-field">
            <span>Format</span>
            <select id="scoringModeSelect">
              <option value="standard">Games and sets</option>
              <option value="fixedTotalPoints">Fixed total points</option>
              <option value="straight">Straight points</option>
              <option value="tiebreakTen">Tiebreak Tens</option>
            </select>
          </label>
          <div id="fixedScoringOptions" class="fixed-scoring-options hidden">
            <label class="scoring-field scoring-range-field">
              <span class="scoring-range-header">
                <span>Total points</span>
                <output id="fixedPointsTargetValue" for="fixedPointsTargetInput">36</output>
              </span>
              <input id="fixedPointsTargetInput" type="range" min="12" max="100" step="4" value="36" />
            </label>
            <label class="scoring-field">
              <span>Serve order</span>
              <input id="fixedServeOrderInput" type="text" placeholder="A1, B1, A2, B2" autocomplete="off" />
            </label>
            <label class="scoring-field scoring-range-field">
              <span class="scoring-range-header">
                <span>Consecutive serves</span>
                <output id="fixedServeBlockLengthValue" for="fixedServeBlockLengthInput">1</output>
              </span>
              <input id="fixedServeBlockLengthInput" type="range" min="1" max="4" step="1" value="1" />
            </label>
            <label class="scoring-field">
              <span>Changeover</span>
              <select id="fixedSideSwapRuleSelect">
                <option value="after_all_players_serve_once">After all players serve once</option>
                <option value="none">Never automatically</option>
              </select>
            </label>
            <label class="scoring-field">
              <span>Tie resolution</span>
              <select id="fixedTieResolutionSelect">
                <option value="allow_draw">Allow draw</option>
                <option value="golden_point">Golden point</option>
              </select>
            </label>
          </div>
          <label class="scoring-field">
            <span>Deuce</span>
            <select id="deuceModeSelect">
              <option value="standard">Advantage</option>
              <option value="golden">Golden point</option>
              <option value="silver">Silver deuce</option>
              <option value="star">Star point</option>
            </select>
          </label>
          <label class="scoring-field">
            <span>Tiebreak</span>
            <select id="tiebreakModeSelect">
              <option value="sixAllSeven">7-point at 6-all (win by 2)</option>
              <option value="sixAllTen">10-point at 6-all (win by 2)</option>
              <option value="off">Off</option>
            </select>
          </label>
          <div id="scoringStatus" class="scoring-status"></div>
        </div>
        <div class="settings-appearance">
          <div class="appearance-layout">
            <section class="appearance-panel">
              <div class="appearance-panel-title">Theme mode</div>
              <!-- @include theme-choices.html -->
            </section>

            <section class="appearance-panel">
              <div class="appearance-panel-title">Team colours</div>
              <div class="colour-grid">
                <label class="colour-field">
                  <span>Team A</span>
                  <span class="team-colour-control">
                    <button type="button" class="team-colour-btn" data-team-colour="A" aria-label="Team A colour"
                      aria-haspopup="dialog"></button>
                    <span class="colour-edit-icon" aria-hidden="true">Edit</span>
                  </span>
                </label>
                <label class="colour-field">
                  <span>Team B</span>
                  <span class="team-colour-control">
                    <button type="button" class="team-colour-btn" data-team-colour="B" aria-label="Team B colour"
                      aria-haspopup="dialog"></button>
                    <span class="colour-edit-icon" aria-hidden="true">Edit</span>
                  </span>
                </label>
              </div>
              <button type="button" class="reset-theme-colours-btn">Reset colours</button>
            </section>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= JOIN COURT MODAL ================= -->
    <div id="joinCourtModal" class="reset-modal hidden" role="dialog" aria-modal="true"
      aria-labelledby="joinCourtModalTitle">
      <form id="joinCourtModalForm" class="create-card join-court-modal-card">
        <button type="button" id="closeJoinCourtModalBtn" class="close-btn" aria-label="Close join court"
          title="Close join court"><span class="icon icon--close" aria-hidden="true"></span></button>
        <h2 id="joinCourtModalTitle">Join as a player</h2>
        <p id="joinCourtModalCourtName"></p>
        <div class="form-group">
          <label for="joinCourtModalPassword">Court Password</label>
          <input id="joinCourtModalPassword" type="password" autocomplete="current-password" />
          <div class="error" id="joinCourtModalPasswordError" role="alert"></div>
        </div>
        <div class="error" id="joinCourtModalError" role="alert"></div>
        <div class="reset-actions join-court-modal-actions">
          <button id="cancelJoinCourtModalBtn" type="button" class="secondary-btn">Cancel</button>
          <button id="submitJoinCourtModalBtn" type="submit" class="primary-btn">Join Court</button>
        </div>
      </form>
    </div>
