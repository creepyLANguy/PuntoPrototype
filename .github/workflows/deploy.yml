name: Firebase Deploy

on:
  push:
    paths:
      - "index.html"
      - "style.css"
      - "app/**"
      - "nfc/**"
      - "media/**"
      - "device-harness/**"
      - "scripts/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "functions/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine deployment scope
    runs-on: ubuntu-latest

    outputs:
      hosting_changed: ${{ steps.scope.outputs.hosting_changed }}
      functions_changed: ${{ steps.scope.outputs.functions_changed }}
      firestore_changed: ${{ steps.scope.outputs.firestore_changed }}
      deploy_needed: ${{ steps.scope.outputs.deploy_needed }}
      validation_needed: ${{ steps.scope.outputs.validation_needed }}
      firebase_targets: ${{ steps.scope.outputs.firebase_targets }}
      requires_force: ${{ steps.scope.outputs.requires_force }}
      public_api_changed: ${{ steps.scope.outputs.public_api_changed }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine changed components
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          all_zero="0000000000000000000000000000000000000000"

          comparison_base=""
          if [[ "$BEFORE_SHA" == "$all_zero" ]]; then
            changed_files="$(git ls-tree -r --name-only "$AFTER_SHA")"
          elif [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
            # Staging deployments must consider the whole feature-branch diff,
            # not just the latest push. This also retries changes from an earlier
            # push whose deployment failed.
            comparison_base="$(git merge-base origin/main "$AFTER_SHA")"
            changed_files="$(git diff --name-only "$comparison_base" "$AFTER_SHA")"
          else
            comparison_base="$BEFORE_SHA"
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          # Package script and devDependency edits are validation-only. Compare
          # the remaining package metadata so dependency/runtime changes still
          # trigger a Functions deploy and API smoke tests.
          functions_package_runtime_changed=true
          if [[ -n "$comparison_base" ]] && git cat-file -e "${comparison_base}:functions/package.json" 2>/dev/null; then
            git show "${comparison_base}:functions/package.json" > "$RUNNER_TEMP/package-base.json"
            git show "$AFTER_SHA:functions/package.json" > "$RUNNER_TEMP/package-head.json"
            if node - "$RUNNER_TEMP/package-base.json" "$RUNNER_TEMP/package-head.json" <<'NODE'
          const fs = require("node:fs");
          function stable(value) {
            return JSON.stringify(value, (_key, child) => {
              if (child && typeof child === "object" && !Array.isArray(child)) {
                return Object.fromEntries(
                  Object.entries(child).sort(([left], [right]) => left.localeCompare(right)),
                );
              }
              return child;
            });
          }
          function runtimePackage(file) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            delete pkg.scripts;
            delete pkg.devDependencies;
            return stable(pkg);
          }
          process.exit(
            runtimePackage(process.argv[2]) === runtimePackage(process.argv[3]) ? 0 : 1,
          );
          NODE
            then
              functions_package_runtime_changed=false
            fi
          fi

          hosting_changed=false
          functions_changed=false
          validation_needed=false
          public_api_changed=false
          firestore_changed=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              index.html|style.css|app/*|nfc/*|media/*|device-harness/*|scripts/*)
                hosting_changed=true
                ;;
            esac

            case "$file" in
              functions/*)
                # Validate test, script, and development-dependency changes even
                # when they do not require deploying a Functions runtime.
                validation_needed=true
                ;;
            esac

            case "$file" in
              functions/*.node-test.*|functions/*.test.*|functions/*.spec.*)
                # Test-only changes require validation, not a Functions deploy.
                ;;
              functions/package.json)
                if [[ "$functions_package_runtime_changed" == "true" ]]; then
                  functions_changed=true
                  public_api_changed=true
                fi
                ;;
              functions/*)
                functions_changed=true
                public_api_changed=true
                ;;
            esac

            case "$file" in
              firestore.rules|firestore.indexes.json)
                firestore_changed=true
                ;;
            esac

            # These files can change the deployment target/configuration for both
            # Hosting and Functions, so keep the conservative full-deploy path.
            case "$file" in
              firebase.json|.firebaserc)
                hosting_changed=true
                functions_changed=true
                public_api_changed=true
                ;;
            esac

            case "$file" in
              scripts/configure-public-function-redirects.mjs|scripts/configure-public-origin.mjs)
                public_api_changed=true
                ;;
            esac
          done <<< "$changed_files"

          # Hosting currently publishes the repository root. To preserve the
          # existing published file set, any Functions change also performs the
          # existing combined deployment rather than a Functions-only deploy.
          deploy_needed=false
          firebase_targets=""
          requires_force=false

          if [[ "$hosting_changed" == "true" || "$functions_changed" == "true" || "$firestore_changed" == "true" ]]; then
            deploy_needed=true
          fi

          if [[ "$functions_changed" == "true" ]]; then
            firebase_targets="functions,hosting"
            requires_force=true
            if [[ "$firestore_changed" == "true" ]]; then
              firebase_targets="functions,hosting,firestore"
            fi
          elif [[ "$hosting_changed" == "true" ]]; then
            firebase_targets="hosting"
            if [[ "$firestore_changed" == "true" ]]; then
              firebase_targets="hosting,firestore"
            fi
          elif [[ "$firestore_changed" == "true" ]]; then
            firebase_targets="firestore"
          fi

          {
            echo "hosting_changed=$hosting_changed"
            echo "functions_changed=$functions_changed"
            echo "firestore_changed=$firestore_changed"
            echo "deploy_needed=$deploy_needed"
            echo "validation_needed=$validation_needed"
            echo "firebase_targets=$firebase_targets"
            echo "requires_force=$requires_force"
            echo "public_api_changed=$public_api_changed"
          } >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          printf '%s\n' "$changed_files"
          echo "Hosting changed: $hosting_changed"
          echo "Functions changed: $functions_changed"
          echo "Firestore rules/indexes changed: $firestore_changed"
          echo "Public API changed: $public_api_changed"
          echo "Validation needed: $validation_needed"
          echo "Firebase targets: ${firebase_targets:-none}"

  validate:
    name: Validate Functions without deployment
    needs: changes
    if: >-
      needs.changes.outputs.validation_needed == 'true' &&
      needs.changes.outputs.deploy_needed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Auto-format Functions JavaScript
        run: npm run format --prefix functions

      - name: Run Functions lint
        run: npm run lint --prefix functions

      - name: Run Functions format check
        if: github.ref == 'refs/heads/main'
        run: npm run format:check --prefix functions

      - name: Run Functions test suite
        run: npm test --prefix functions

  deploy_production:
    name: Deploy production
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create firebase-config.js
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JS_CONTENT_PRODUCTION }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" > app/js/firebase-config.js

      - name: Configure public origin
        env:
          PUBLIC_ORIGIN: https://www.padelpush.co.za
        run: node scripts/configure-public-origin.mjs

      - name: Configure public function redirects
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
        run: node scripts/configure-public-function-redirects.mjs

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The frontend build, structure validation and test suite need the
      # Functions package's development dependencies, so they are installed for
      # every deploy (Hosting ignores node_modules, so the deployed file set is
      # unchanged).
      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Auto-format Functions JavaScript
        if: needs.changes.outputs.functions_changed == 'true'
        run: npm run format --prefix functions

      - name: Run Functions lint
        if: needs.changes.outputs.functions_changed == 'true'
        run: npm run lint --prefix functions

      - name: Run Functions format check
        if: >-
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.functions_changed == 'true'
        run: npm run format:check --prefix functions

      # Rebuild the generated Hosting artifacts (app/index.html, app/overlay.html,
      # app/css/style.css) from their sources after the environment has been
      # configured, so exactly what is validated and tested below is deployed.
      - name: Build frontend
        run: node scripts/build-frontend.mjs

      - name: Validate frontend structure
        run: node scripts/check-frontend-structure.mjs

      - name: Lint frontend modules
        if: needs.changes.outputs.hosting_changed == 'true'
        run: npm run lint:frontend --prefix functions

      - name: Run tests
        run: npm test --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.30.2

      - name: Show Firebase CLI version
        run: firebase --version

      - name: Remove legacy scheduled function
        if: needs.changes.outputs.functions_changed == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}
        run: |
          FIREBASE_TOOLS_ROOT="$(npm root -g)/firebase-tools" \
            node scripts/delete-legacy-retention-worker.cjs

      - name: Deploy production
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}
          FIREBASE_TARGETS: ${{ needs.changes.outputs.firebase_targets }}
          REQUIRES_FORCE: ${{ needs.changes.outputs.requires_force }}
        run: |
          if [[ "$REQUIRES_FORCE" == "true" ]]; then
            firebase deploy \
              --only "$FIREBASE_TARGETS" \
              --force \
              --project "$FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN"
          else
            firebase deploy \
              --only "$FIREBASE_TARGETS" \
              --project "$FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN"
          fi

      - name: Smoke-test public endpoints
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
        run: node scripts/smoke-test-public-routes.mjs https://www.padelpush.co.za "$FIREBASE_PROJECT_ID"

  deploy_staging:
    name: Deploy staging
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      needs.changes.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create firebase-config.js
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JS_CONTENT_STAGING }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" > app/js/firebase-config.js

      - name: Configure public origin
        env:
          PUBLIC_ORIGIN: https://qa.padelpush.co.za
        run: node scripts/configure-public-origin.mjs

      - name: Configure public function redirects
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_STAGING }}
        run: node scripts/configure-public-function-redirects.mjs

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The frontend build, structure validation and test suite need the
      # Functions package's development dependencies, so they are installed for
      # every deploy (Hosting ignores node_modules, so the deployed file set is
      # unchanged).
      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Auto-format Functions JavaScript
        if: needs.changes.outputs.functions_changed == 'true'
        run: npm run format --prefix functions

      - name: Run Functions lint
        if: needs.changes.outputs.functions_changed == 'true'
        run: npm run lint --prefix functions

      - name: Run Functions format check
        if: >-
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.functions_changed == 'true'
        run: npm run format:check --prefix functions

      # Rebuild the generated Hosting artifacts (app/index.html, app/overlay.html,
      # app/css/style.css) from their sources after the environment has been
      # configured, so exactly what is validated and tested below is deployed.
      - name: Build frontend
        run: node scripts/build-frontend.mjs

      - name: Validate frontend structure
        run: node scripts/check-frontend-structure.mjs

      - name: Lint frontend modules
        if: needs.changes.outputs.hosting_changed == 'true'
        run: npm run lint:frontend --prefix functions

      - name: Run tests
        run: npm test --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.30.2

      - name: Show Firebase CLI version
        run: firebase --version

      - name: Remove legacy scheduled function
        if: needs.changes.outputs.functions_changed == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_STAGING }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}
        run: |
          FIREBASE_TOOLS_ROOT="$(npm root -g)/firebase-tools" \
            node scripts/delete-legacy-retention-worker.cjs

      - name: Deploy staging
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_STAGING }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}
          FIREBASE_TARGETS: ${{ needs.changes.outputs.firebase_targets }}
          REQUIRES_FORCE: ${{ needs.changes.outputs.requires_force }}
        run: |
          if [[ "$REQUIRES_FORCE" == "true" ]]; then
            firebase deploy \
              --only "$FIREBASE_TARGETS" \
              --force \
              --project "$FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN"
          else
            firebase deploy \
              --only "$FIREBASE_TARGETS" \
              --project "$FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN"
          fi

      - name: Smoke-test public endpoints
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_STAGING }}
          PUBLIC_API_CHANGED: ${{ needs.changes.outputs.public_api_changed }}
        run: |
          if [[ "$PUBLIC_API_CHANGED" == "true" ]]; then
            echo "Running full public API smoke tests because backend or routing configuration changed."
            node scripts/smoke-test-public-routes.mjs https://qa.padelpush.co.za "$FIREBASE_PROJECT_ID"
          else
            echo "Running static route smoke tests; this change does not affect public API behavior."
            node scripts/smoke-test-public-routes.mjs https://qa.padelpush.co.za "$FIREBASE_PROJECT_ID" --skip-api
          fi
