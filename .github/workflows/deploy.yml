name: Firebase Deploy

on:
  push:
    paths:
      - "index.html"
      - "style.css"
      - "app/**"
      - "nfc/**"
      - "media/**"
      - "firebase.json"
      - ".firebaserc"
      - "functions/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create firebase-config.js
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JS_CONTENT_PRODUCTION }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" > app/js/firebase-config.js

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Show Firebase CLI version
        run: firebase --version

      - name: Deploy production
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}
        run: |
          firebase deploy \
            --only functions,hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN"

  deploy_staging:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create firebase-config.js
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JS_CONTENT_STAGING }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" > app/js/firebase-config.js

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Show Firebase CLI version
        run: firebase --version

      - name: Deploy staging
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_STAGING }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}
        run: |
          firebase deploy \
            --only functions,hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN"
