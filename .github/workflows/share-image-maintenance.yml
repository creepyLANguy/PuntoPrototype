name: Share image maintenance

on:
  push:
    branches:
      - fix/share-match-image-improvements

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply share-image fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("app/js/script.js")
          source = path.read_text()

          helper_pattern = re.compile(
              r"async function blobToImage\(blob\)\n\{.*?\n\}\n\nasync function padShareImageToSquare\(blob, backgroundColor\)\n\{.*?\n\}\n\n(?=// The captured card is only ever consumed)",
              re.S,
          )
          source, count = helper_pattern.subn("// The captured card is only ever consumed", source)
          if count != 1:
              raise SystemExit(f"Expected exactly one square-image helper block, found {count}")

          clone_marker = "  const clone = element.cloneNode(true);\n\n"
          clone_insert = """  const clone = element.cloneNode(true);\n\n  // Interactive controls and the details dropdown are part of the live modal,\n  // but must never be included in the shareable image. Remove them from the\n  // cloned DOM before html-to-image serializes it.\n  clone\n    .querySelectorAll('.dm-close, .dm-share-btn, .dm-details-panel, .dm-empty-state, .dm-error-state')\n    .forEach(node => node.remove());\n\n"""
          if source.count(clone_marker) != 1:
              raise SystemExit("Could not locate share-card clone marker")
          source = source.replace(clone_marker, clone_insert, 1)

          exclusions = """      'dm-close',\n      'dm-share-btn',\n      'dm-empty-state',\n"""
          exclusions_new = """      'dm-close',\n      'dm-share-btn',\n      'dm-details-panel',\n      'dm-empty-state',\n"""
          if source.count(exclusions) != 1:
              raise SystemExit("Could not locate html-to-image exclusion list")
          source = source.replace(exclusions, exclusions_new, 1)

          square_block = """  // Social sharing should always produce a square asset. The original card\n  // keeps its natural dimensions; this final pass adds matching-theme padding\n  // to whichever axis is shorter so no content is cropped.\n  const squareBlob = await padShareImageToSquare(blob, cardBackground);\n\n"""
          if source.count(square_block) != 1:
              raise SystemExit("Could not locate square-output block")
          source = source.replace(square_block, "", 1)

          if source.count("    [squareBlob],") != 1:
              raise SystemExit("Could not locate squareBlob File output")
          source = source.replace("    [squareBlob],", "    [blob],", 1)

          path.write_text(source)

          package_path = Path("functions/package.json")
          package = json.loads(package_path.read_text())
          test_name = "frontendShareImage.node-test.mjs"
          if test_name not in package["scripts"]["test"]:
              package["scripts"]["test"] += " " + test_name
              package_path.write_text(json.dumps(package, indent=2) + "\n")

          Path("functions/frontendShareImage.node-test.mjs").write_text(r'''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import test from "node:test";
import vm from "node:vm";

const source = readFileSync(new URL("../app/js/script.js", import.meta.url), "utf8");

test("share-image source is valid JavaScript", () =>
{
  assert.doesNotThrow(() => new vm.Script(source));
});

test("share image excludes interactive details UI", () =>
{
  assert.match(
    source,
    /querySelectorAll\('\.dm-close, \.dm-share-btn, \.dm-details-panel, \.dm-empty-state, \.dm-error-state'\)\s*\n\s*\.forEach\(node => node\.remove\(\)/
  );
  assert.match(source, /'dm-details-panel'/);
});

test("long team names wrap instead of ellipsizing", () =>
{
  assert.match(source, /node\.style\.whiteSpace = 'normal'/);
  assert.match(source, /node\.style\.textOverflow = 'clip'/);
  assert.match(source, /node\.style\.overflowWrap = 'anywhere'/);
  assert.match(source, /node\.style\.wordBreak = 'break-word'/);
});

test("share capture uses the modal background", () =>
{
  assert.match(source, /const cardBackground = getComputedStyle\(element\)\.backgroundColor/);
  assert.match(source, /clone\.style\.background = cardBackground/);
  assert.match(source, /backgroundColor: cardBackground/);
});

test("light-theme watermark is embedded as an explicit image", () =>
{
  assert.match(source, /const watermarkColor = isLightTheme \? '#111111' : '#ffffff'/);
  assert.match(source, /watermarkImage\.src = watermarkLogoDataUrl/);
  assert.match(source, /watermarkImage\.style\.filter = 'none'/);
});

test("QR code receives a centred Padel Push logo", () =>
{
  assert.match(source, /const qrLogoBadge = document\.createElement\('span'\)/);
  assert.match(source, /qrLogoBadge\.style\.left = '50%'/);
  assert.match(source, /qrLogoBadge\.style\.top = '50%'/);
  assert.match(source, /qrLogo\.src = shareLogoDataUrl/);
});

test("share output retains the natural capture aspect ratio", () =>
{
  assert.doesNotMatch(source, /padShareImageToSquare/);
  assert.doesNotMatch(source, /squareBlob/);
  assert.match(source, /const file = new File\(\s*\[blob\],\s*'share-image\.png'/s);
});
''')
          PY

      - name: Verify changes
        run: |
          node --check functions/frontendShareImage.node-test.mjs
          node --test functions/frontendShareImage.node-test.mjs
          git diff --check

      - name: Commit fixes and remove maintenance workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/share-image-maintenance.yml
          git add app/js/script.js functions/package.json functions/frontendShareImage.node-test.mjs
          git diff --cached --check
          git commit -m "Fix share image regressions and add coverage"
          git push
