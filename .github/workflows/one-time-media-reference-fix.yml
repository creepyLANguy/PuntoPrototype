name: One-time media reference fix

on:
  push:
    branches:
      - fix/broken-media-references

permissions:
  contents: write

jobs:
  fix-media-references:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/broken-media-references
          fetch-depth: 0

      - name: Fix shared media references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "app/index.html": [
                  ('href="media/favicon.svg"', 'href="/media/favicon.svg"'),
                  ('src="media/logo.svg"', 'src="/media/logo.svg"'),
              ],
              "app/js/script.js": [
                  ('src="media/logo.svg"', 'src="/media/logo.svg"'),
              ],
              "app/css/style.css": [
                  ('../media/logo.svg', '/media/logo.svg'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No changes made to {filename}; expected reference not found')
              path.write_text(text)
          PY

      - name: Remove temporary workflow and commit changes
        shell: bash
        run: |
          rm .github/workflows/one-time-media-reference-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html app/js/script.js app/css/style.css .github/workflows/one-time-media-reference-fix.yml
          git commit -m "Fix shared media asset references"
          git push origin HEAD:fix/broken-media-references
