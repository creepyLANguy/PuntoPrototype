name: Apply direct-link join sound fix

on:
  push:
    branches:
      - fix/direct-link-join-sound

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: handle blocked direct-link join audio') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply audio behaviour changes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/js/script.js')
          text = path.read_text()

          old_count = len(re.findall(r'async function playSound\(id, force = false\)', text))
          if old_count != 1:
              raise SystemExit(f'Expected exactly one playSound implementation, found {old_count}.')

          new_play_sound = '''async function playSound(id, force = false, dropIfBlocked = false)
  {
    if (muted && !force) return false;

    if (!audioReady)
    {
      try
      {
        await initAudio();
      }
      catch (err)
      {
        console.warn("Audio initialization failed:", err);
        return false;
      }
    }

    if (dropIfBlocked && (!audioContext || audioContext.state !== "running"))
    {
      return false;
    }

    const buffer = audioBuffers[id];
    if (!buffer) return false;

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start();
    return true;
  }

  async function playJoinSound()
  {
    try
    {
      await initAudio();
      return await playSound(SOUND_IDS.START, false, true);
    }
    catch (err)
    {
      console.warn("Join sound could not be played:", err);
      return false;
    }
  }'''

          pattern = r'async function playSound\(id, force = false\)\n  \{.*?\n  \}\n\n  function loadSound'
          replacement = new_play_sound + '\n\n  function loadSound'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected playSound implementation was not replaced.')

          join_old = '''    try
    {
      await initAudio();
      playSound(SOUND_IDS.START);
    }
    catch (err)
    {
      console.warn("Audio initialization failed:", err);
    }

    elements.menuPage.style.display = "none";'''
          join_new = '''    if (historyMode !== "skip")
    {
      await playJoinSound();
    }

    elements.menuPage.style.display = "none";'''

          if text.count(join_old) != 1:
              raise SystemExit(f'Expected exactly one enterCourt audio block, found {text.count(join_old)}.')
          text = text.replace(join_old, join_new, 1)

          path.write_text(text)

      - name: Remove one-shot patch workflow
        run: rm .github/workflows/apply-direct-link-audio-fix.yml

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/js/script.js .github/workflows/apply-direct-link-audio-fix.yml
          git commit -m "fix: handle blocked direct-link join audio"
          git push
