name: One-time Prettier fix

on:
  push:
    branches:
      - chore/ci-prettier-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Format Functions files
        run: npm run format --prefix functions

      - name: Commit formatted files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add functions
          git rm .github/workflows/prettier-fix.yml
          
          if git diff --cached --quiet; then
            echo "No formatting changes found."
            exit 0
          fi

          git commit -m "chore: format functions tests with Prettier"
          git push origin HEAD:chore/ci-prettier-fix
