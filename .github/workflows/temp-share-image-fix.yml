name: Temporary share-image cleanup
on:
  push:
    branches: [fix/share-match-image-improvements]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('app/js/script.js')
          source = path.read_text()
          pattern = re.compile(r"async function blobToImage\(blob\)\n\{.*?\n\}\n\nasync function padShareImageToSquare\(blob, backgroundColor\)\n\{.*?\n\}\n\n(?=// The captured card is only ever consumed)", re.S)
          source, count = pattern.subn('// The captured card is only ever consumed', source)
          if count != 1:
              raise SystemExit(f'Expected one square helper block, found {count}')

          old = """  const clone = element.cloneNode(true);\n\n  // The modal intentionally ellipsizes long team names for the compact on-screen\n"""
          new = """  const clone = element.cloneNode(true);\n\n  // Exclude the interactive details dropdown/panel from the share image.\n  clone\n    .querySelectorAll('.dm-close, .dm-share-btn, .dm-details-panel, .dm-empty-state, .dm-error-state')\n    .forEach(node => node.remove());\n\n  // The modal intentionally ellipsizes long team names for the compact on-screen\n"""
          if source.count(old) != 1:
              raise SystemExit('Share clone block not found')
          source = source.replace(old, new, 1)

          old = """      'dm-close',\n      'dm-share-btn',\n      'dm-empty-state',\n"""
          new = """      'dm-close',\n      'dm-share-btn',\n      'dm-details-panel',\n      'dm-empty-state',\n"""
          if source.count(old) != 1:
              raise SystemExit('Share filter block not found')
          source = source.replace(old, new, 1)

          old = """  // Social sharing should always produce a square asset. The original card\n  // keeps its natural dimensions; this final pass adds matching-theme padding\n  // to whichever axis is shorter so no content is cropped.\n  const squareBlob = await padShareImageToSquare(blob, cardBackground);\n\n"""
          if source.count(old) != 1:
              raise SystemExit('Square output block not found')
          source = source.replace(old, '', 1)
          if source.count('    [squareBlob],') != 1:
              raise SystemExit('squareBlob output not found')
          source = source.replace('    [squareBlob],', '    [blob],', 1)
          path.write_text(source)

          package_path = Path('functions/package.json')
          package = json.loads(package_path.read_text())
          test_name = 'frontendShareImage.node-test.mjs'
          if test_name not in package['scripts']['test']:
              package['scripts']['test'] += ' ' + test_name
              package_path.write_text(json.dumps(package, indent=2) + '\n')

          Path('functions/frontendShareImage.node-test.mjs').write_text(r'''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import test from "node:test";
import vm from "node:vm";

const source = readFileSync(new URL("../app/js/script.js", import.meta.url), "utf8");

test("share-image source remains valid JavaScript", () =>
{
  assert.doesNotThrow(() => new vm.Script(source));
});

test("interactive details panel is excluded from the share clone and filter", () =>
{
  assert.match(source, /querySelectorAll\('\.dm-close, \.dm-share-btn, \.dm-details-panel, \.dm-empty-state, \.dm-error-state'\)\s*\n\s*\.forEach\(node => node\.remove\(\)\)/);
  assert.match(source, /'dm-details-panel'/);
});

test("long team names use wrapping instead of ellipsis", () =>
{
  assert.match(source, /node\.style\.whiteSpace = 'normal'/);
  assert.match(source, /node\.style\.textOverflow = 'clip'/);
  assert.match(source, /node\.style\.overflowWrap = 'anywhere'/);
  assert.match(source, /node\.style\.wordBreak = 'break-word'/);
});

test("capture uses the match-details modal surface", () =>
{
  assert.match(source, /const cardBackground = getComputedStyle\(element\)\.backgroundColor/);
  assert.match(source, /clone\.style\.background = cardBackground/);
  assert.match(source, /backgroundColor: cardBackground/);
});

test("light-theme watermark is explicitly embedded", () =>
{
  assert.match(source, /const watermarkColor = isLightTheme \? '#111111' : '#ffffff'/);
  assert.match(source, /watermarkImage\.src = watermarkLogoDataUrl/);
  assert.match(source, /watermarkImage\.style\.filter = 'none'/);
});

test("QR contains a centred Padel Push logo", () =>
{
  assert.match(source, /const qrLogoBadge = document\.createElement\('span'\)/);
  assert.match(source, /qrLogoBadge\.style\.left = '50%'/);
  assert.match(source, /qrLogoBadge\.style\.top = '50%'/);
  assert.match(source, /qrLogo\.src = shareLogoDataUrl/);
});

test("share output keeps its natural aspect ratio", () =>
{
  assert.doesNotMatch(source, /padShareImageToSquare/);
  assert.doesNotMatch(source, /squareBlob/);
  assert.match(source, /const file = new File\(\s*\[blob\],\s*'share-image\.png'/s);
});
''')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-share-image-fix.yml
          git add app/js/script.js functions/package.json functions/frontendShareImage.node-test.mjs
          git diff --cached --check
          git commit -m "Fix share card exclusions and add regression tests"
          git push
