name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Format QR resize regression test in CI scratch
        working-directory: functions
        run: npx prettier --write frontendQrPanelResize.node-test.mjs && cat frontendQrPanelResize.node-test.mjs
      - name: Run Functions format check
        working-directory: functions
        run: npm run format:check
      - name: Run unit, frontend, and OpenAPI contract tests
        working-directory: functions
        run: npm test
