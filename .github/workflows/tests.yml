name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Run Functions format check
        working-directory: functions
        run: npm run format:check

      # The generated Hosting artifacts are rebuilt from their sources before
      # anything inspects them, so the jsdom harness always boots exactly what
      # Hosting serves. --check fails if a committed artifact was edited directly
      # or its sources changed without a rebuild.
      - name: Build frontend (verify generated artifacts)
        run: node scripts/build-frontend.mjs --check

      - name: Validate frontend structure
        run: node scripts/check-frontend-structure.mjs

      - name: Lint frontend modules
        working-directory: functions
        run: npm run lint:frontend

      - name: Check branding
        run: node scripts/check-branding.mjs

      - name: Run unit, frontend, and OpenAPI contract tests
        working-directory: functions
        run: npm test
      - name: Validate Device Lab browser modules
        run: |
          node --check device-harness/script.js
          node --check device-harness/device-profiles.js
