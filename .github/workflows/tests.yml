name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Show Prettier output for index.js
        working-directory: functions
        run: |
          npm run format
          git --no-pager diff -- index.js
