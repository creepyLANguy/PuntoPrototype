name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Show canonical postEvent formatting
        working-directory: functions
        run: |
          npx prettier --write http/postEvent.js
          git diff -- http/postEvent.js
          exit 1
      - name: Run Functions format check
        working-directory: functions
        run: npm run format:check
      - name: Run unit, frontend, and OpenAPI contract tests
        working-directory: functions
        run: npm test
      - name: Validate Device Lab browser modules
        run: |
          node --check device-harness/script.js
          node --check device-harness/device-profiles.js
