name: One-shot deferred join sound fix

on:
  push:
    branches: ['fix/direct-link-join-sound']

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build clean fix from intended base
        shell: bash
        run: |
          set -euo pipefail
          BASE="7b62644f449712a18be9d605b46de336cd86a01b"
          git reset --hard "$BASE"

          python3 - <<'PY'
          from pathlib import Path

          script = Path("app/js/script.js")
          text = script.read_text()

          old_state = '''  let audioContext = null;\n  let audioBuffers = {};\n  let audioReady = false;\n'''
          new_state = '''  let audioContext = null;\n  let audioBuffers = {};\n  let audioReady = false;\n  let audioUserGestureObserved = false;\n  let pendingJoinSound = false;\n  let audioUnlockInFlight = false;\n'''
          assert text.count(old_state) == 1
          text = text.replace(old_state, new_state, 1)

          old_play = '''  async function playJoinSound()\n  {\n    try\n    {\n      return await playSound(SOUND_IDS.START, false, true);\n    }\n    catch (err)\n    {\n      console.warn("Join sound could not be played:", err);\n      return false;\n    }\n  }\n'''
          new_play = '''  async function resumeAudioContext()\n  {\n    if (!audioContext) return false;\n    if (audioContext.state === "running") return true;\n\n    try\n    {\n      await audioContext.resume();\n    }\n    catch (err)\n    {\n      console.warn("Audio context could not be resumed:", err);\n      return false;\n    }\n\n    return audioContext.state === "running";\n  }\n\n  async function flushPendingJoinSound()\n  {\n    if (!pendingJoinSound || muted || audioUnlockInFlight) return false;\n\n    audioUnlockInFlight = true;\n\n    try\n    {\n      if (!audioContext)\n      {\n        await initAudio();\n      }\n\n      const resumed = await resumeAudioContext();\n      if (!resumed) return false;\n\n      const played = await playSound(SOUND_IDS.START, false, true);\n      if (played)\n      {\n        pendingJoinSound = false;\n      }\n\n      return played;\n    }\n    catch (err)\n    {\n      console.warn("Deferred join sound could not be played:", err);\n      return false;\n    }\n    finally\n    {\n      audioUnlockInFlight = false;\n    }\n  }\n\n  function noteUserAudioGesture()\n  {\n    audioUserGestureObserved = true;\n\n    if (!audioContext) return;\n\n    void (async () =>\n    {\n      const resumed = await resumeAudioContext();\n      if (resumed && pendingJoinSound)\n      {\n        await flushPendingJoinSound();\n      }\n    })();\n  }\n\n  document.addEventListener("pointerdown", noteUserAudioGesture, { capture: true });\n  document.addEventListener("touchstart", noteUserAudioGesture, { capture: true, passive: true });\n  document.addEventListener("keydown", noteUserAudioGesture, { capture: true });\n\n  async function playJoinSound()\n  {\n    if (muted) return false;\n\n    try\n    {\n      const played = await playSound(SOUND_IDS.START, false, true);\n      if (played)\n      {\n        pendingJoinSound = false;\n        return true;\n      }\n\n      // A direct URL can enter a court before the browser has granted audio\n      // playback permission. Preserve the cue and play it on the first gesture.\n      if (!audioContext || audioContext.state !== "running")\n      {\n        pendingJoinSound = true;\n        if (audioUserGestureObserved)\n        {\n          return await flushPendingJoinSound();\n        }\n      }\n\n      return false;\n    }\n    catch (err)\n    {\n      console.warn("Join sound could not be played:", err);\n      return false;\n    }\n  }\n'''
          assert text.count(old_play) == 1
          text = text.replace(old_play, new_play, 1)
          script.write_text(text)

          harness = Path("functions/frontendHarness/harness.mjs")
          htext = harness.read_text()
          old_audio = '''  window.AudioContext = class\n  {\n    constructor() { this.destination = {}; }\n    async decodeAudioData() { return {}; }\n    createBufferSource() { return { connect: () => {}, start: () => {} }; }\n  };\n'''
          new_audio = '''  window.__audioTestState = { contexts: 0, resumeCalls: 0, starts: 0 };\n\n  window.AudioContext = class\n  {\n    constructor()\n    {\n      this.state = "suspended";\n      this.destination = {};\n      window.__audioTestState.contexts += 1;\n    }\n\n    async resume()\n    {\n      window.__audioTestState.resumeCalls += 1;\n      this.state = "running";\n    }\n\n    async decodeAudioData() { return {}; }\n\n    createBufferSource()\n    {\n      return\n      {\n        connect: () => {},\n        start: () => { window.__audioTestState.starts += 1; }\n      };\n    }\n  };\n'''
          assert htext.count(old_audio) == 1
          harness.write_text(htext.replace(old_audio, new_audio, 1))

          Path("functions/frontendAudio.node-test.mjs").write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\n\nimport\n{\n  bootFrontend,\n  seedBaseData,\n  seedCourt,\n  waitFor,\n  settle\n} from "./frontendHarness/harness.mjs";\n\nlet window;\n\ntest.before(async () =>\n{\n  seedBaseData();\n  seedCourt("audiocourt");\n\n  const dom = await bootFrontend({ url: "https://padel.test/c/audiocourt" });\n  window = dom.window;\n});\n\ntest("direct court links defer the join sound until the first user gesture", async () =>\n{\n  await waitFor(\n    () => window.__audioTestState.contexts > 0,\n    { label: "audio context created during direct route join" }\n  );\n\n  await settle(25);\n  assert.equal(window.__audioTestState.starts, 0, "autoplay-blocked join sound must not start immediately");\n\n  window.document.body.dispatchEvent(new window.Event("pointerdown", { bubbles: true, cancelable: true }));\n\n  await waitFor(\n    () => window.__audioTestState.resumeCalls > 0,\n    { label: "audio context resume after user gesture" }\n  );\n  await waitFor(\n    () => window.__audioTestState.starts === 1,\n    { label: "deferred join sound playback" }\n  );\n});\n''')

          package = Path("functions/package.json")
          ptext = package.read_text()
          old_test = 'frontendCourtPassword.node-test.mjs"'
          new_test = 'frontendCourtPassword.node-test.mjs frontendAudio.node-test.mjs"'
          assert ptext.count(old_test) == 1
          package.write_text(ptext.replace(old_test, new_test, 1))
          PY

          git rm -f .github/workflows/one-shot-deferred-join-sound-fix.yml 2>/dev/null || true
          git add -A
          git diff --cached --check

      - name: Run targeted audio regression test
        working-directory: functions
        run: |
          npm ci
          node --test frontendAudio.node-test.mjs

      - name: Run full test suite
        working-directory: functions
        run: npm test

      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7b62644f449712a18be9d605b46de336cd86a01b"
          git commit -m "Fix deferred direct-link join sound"
          git push --force origin HEAD:fix/direct-link-join-sound
